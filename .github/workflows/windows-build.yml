name: Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [codex/windows-exe]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Check prompt scripts
        run: node --check frontend/match-prompts.js
      - name: Test Windows client
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Check Windows client
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@2.12.2
      - name: Build installer
        shell: cmd
        run: tauri build --ci -- --locked
      - name: Prepare download and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe
          if (@($installer).Count -ne 1) { throw "Expected exactly one installer" }
          Copy-Item $installer.FullName dist/
          Copy-Item src-tauri/target/release/billiards_matrix.exe dist/
          Copy-Item docs/WINDOWS_EXE.md dist/README.md
          Copy-Item docs/MATCH_BUDDY_PROMPTS.md dist/
          New-Item -ItemType Directory -Path dist/fonts -Force | Out-Null
          Copy-Item src-tauri/fonts/OFL.txt, src-tauri/fonts/NOTICE.md dist/fonts/
          Get-ChildItem dist/*.exe | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: billiards-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30
