<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>台球图文生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"Segoe UI",sans-serif}
:root{--bg:#1E1E1E;--bg2:#262626;--bg3:#323232;--bg4:#383838;--border:#404040;--border2:#4A4A4A;--t1:#E8E8E8;--t2:#A0A0A0;--t3:#707070;--accent:#2680EB;--accent-h:#3A8FFF;--danger:#FA6F3C;--purple:#6B4FBB}
body{background:var(--bg);color:var(--t1);min-height:100vh;font-size:13px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#4A4A4A;border:2px solid var(--bg);border-radius:5px}::-webkit-scrollbar-thumb:hover{background:#5A5A5A}
.tabs{display:flex;background:var(--bg2);padding:0;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.tab{padding:14px 20px;cursor:pointer;color:var(--t2);font-size:12px;font-weight:500;border-bottom:2px solid transparent;transition:all .15s;border-right:1px solid var(--border)}
.tab:hover{color:var(--t1);background:var(--bg3)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tab.active{color:var(--t1);border-color:var(--accent);background:var(--bg)}
.page{display:none}.page.active{display:flex}
.left{width:440px;background:var(--bg2);padding:20px;overflow-y:auto;height:calc(100vh - 47px);border-right:1px solid var(--border)}
.left h1{font-size:16px;font-weight:600;margin-bottom:4px;color:var(--t1)}
.left .sub{font-size:11px;color:var(--t3);margin-bottom:18px}
.col-l{width:330px;background:var(--bg2);padding:18px 16px;overflow-y:auto;height:calc(100vh - 47px);border-right:1px solid var(--border)}
.col-l h1{font-size:16px;font-weight:600;margin-bottom:4px;color:var(--t1)}
.col-l .sub{font-size:11px;color:var(--t3);margin-bottom:14px}
.col-c{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;background:var(--bg)}
.col-r{width:230px;background:var(--bg2);padding:14px;overflow-y:auto;height:calc(100vh - 47px);border-left:1px solid var(--border)}
.col-c .preview{max-height:92vh;border-radius:4px;box-shadow:0 8px 32px rgba(0,0,0,.5);cursor:zoom-in}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:var(--t2);margin-bottom:6px;font-weight:500}
.field input,.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--t1);padding:8px 10px;border-radius:4px;font-size:12px;outline:none;transition:all .15s}
.field input:hover,.field textarea:hover,.field select:hover{border-color:var(--border2)}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.field textarea.prompt-generated{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.field input.fit-warn,.field textarea.fit-warn{border-color:#FFB86C;box-shadow:inset 0 0 0 1px rgba(255,184,108,.45)}
.field input.fit-error,.field textarea.fit-error{border-color:#FF8855;box-shadow:inset 0 0 0 1px rgba(255,136,85,.55);background:rgba(250,111,60,.06)}
.field textarea{resize:vertical;min-height:72px;line-height:1.5}
.row{display:flex;gap:8px}.row .field{flex:1}
.colors{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.color-opt{height:32px;border-radius:4px;cursor:pointer;border:1px solid var(--border);transition:all .15s}
.color-opt:hover{border-color:var(--border2)}
.color-opt.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
input[type=color]{width:50px;height:50px;border:2px solid var(--border2);border-radius:50%;cursor:pointer;background:none;padding:0;overflow:hidden;transition:all .15s;box-shadow:0 0 0 2px var(--bg2),0 2px 8px rgba(0,0,0,.3)}
input[type=color]:hover{border-color:var(--accent);box-shadow:0 0 0 2px var(--bg2),0 0 0 3px var(--accent),0 0 14px rgba(38,128,235,.4);transform:scale(1.05)}
input[type=color]::-webkit-color-swatch{border:none;border-radius:50%}
input[type=color]::-webkit-color-swatch-wrapper{padding:0;border-radius:50%}
button{padding:10px;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:4px;font-size:12px;font-weight:500;cursor:pointer;width:100%;transition:all .15s}
button:hover{background:var(--accent-h);border-color:var(--accent-h)}
button.sec{background:var(--bg3);color:var(--t1);border:1px solid var(--border);margin-top:8px}
button.sec:hover{background:var(--bg4);border-color:var(--border2)}
button:disabled{cursor:not-allowed;opacity:.48;filter:saturate(.65)}
button:disabled:hover{background:var(--bg3);border-color:var(--border);transform:none}
.action-status{min-height:18px;margin-top:7px;font-size:11px;line-height:1.45;color:var(--t2)}
.action-status.success{color:#4ADE80}.action-status.error{color:#FF8855}
.copy-fit-hint{margin:-6px 0 12px;padding:10px;border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:4px;background:rgba(255,255,255,.035);font-size:10px;line-height:1.45;color:var(--t2)}
.copy-fit-hint.ok{border-left-color:#4ADE80}.copy-fit-hint.warn{border-left-color:#FFB86C}.copy-fit-hint.error{border-left-color:#FF8855;background:rgba(250,111,60,.08)}
.copy-fit-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}.copy-fit-title{font-size:11px;font-weight:600;color:var(--t1)}.copy-fit-badge{flex:0 0 auto;padding:2px 7px;border-radius:999px;background:rgba(74,222,128,.12);color:#4ADE80}.copy-fit-hint.error .copy-fit-badge{background:rgba(255,136,85,.14);color:#FF8855}.copy-fit-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.copy-fit-chip{padding:5px 6px;border:1px solid var(--border);border-radius:3px;background:var(--bg)}.copy-fit-chip.over{border-color:#FF8855;color:#FF8855}.copy-fit-detail{margin-top:7px;color:var(--t3)}
.bi-fit{font-size:10px;line-height:1.45;margin-top:-2px;margin-bottom:6px;color:var(--t3)}.bi-fit.error{color:#FF8855}.bi-fit.ok{color:#4ADE80}.bi-item.overfit{border-color:#FF8855!important;box-shadow:0 0 0 1px rgba(255,136,85,.25)}
.cloud-panel{margin-bottom:18px;padding:12px;background:var(--bg3);border:1px solid var(--border);border-radius:4px}
.cloud-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cloud-actions button{margin:0}
.cloud-summary{min-width:260px;text-align:left;line-height:1.8;color:var(--t2)}
.hint{color:var(--t3);font-size:12px;text-align:center;line-height:1.7}
.sect{font-size:10px;color:var(--t2);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin:14px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.render-badge{position:absolute;top:16px;left:16px;background:rgba(38,128,235,.92);color:#fff;font-size:10px;padding:4px 10px;border-radius:3px;display:none;z-index:5;font-weight:500}
.hist-h{font-size:10px;color:var(--t2);margin-bottom:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.hist-clear{float:right;width:auto;padding:0;background:none;border:0;color:var(--t3);font-size:10px;font-weight:500}
.hist-clear:hover{background:none;border:0;color:var(--t1)}
.hist-item{width:100%;margin-bottom:8px;border-radius:4px;overflow:hidden;border:1px solid var(--border);cursor:pointer;transition:all .15s}
.hist-item:hover{border-color:var(--accent)}
.hist-item img{width:100%;display:block}
.hist-empty{font-size:11px;color:var(--t3);text-align:center;padding:20px 0;line-height:1.6}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{padding:5px 4px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--t2);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
td input,td select,td textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--t1);padding:4px 6px;border-radius:3px;font-size:11px}
td input:focus,td select:focus,td textarea:focus{border-color:var(--accent)}
td textarea{min-height:48px;resize:vertical}
.acc-tbl{font-size:12px;margin-top:12px}.acc-tbl th{color:var(--t2);padding:7px 5px}
.batch-grid{flex:1;display:flex;flex-wrap:wrap;gap:12px;overflow-y:auto;padding:24px;align-content:flex-start}
.batch-item{position:relative;border-radius:4px;overflow:hidden;border:1px solid var(--border);transition:border-color .15s}
.batch-item:hover{border-color:var(--border2)}
.batch-item img{height:320px;display:block;cursor:zoom-in}
.batch-item .dl{position:absolute;bottom:6px;right:6px;background:rgba(30,30,30,.85);color:#fff;padding:4px 8px;border-radius:3px;font-size:10px;text-decoration:none;border:1px solid var(--border)}
.template-mix{margin:-2px 0 14px;padding:10px;background:var(--bg3);border:1px solid var(--border);border-radius:4px}
.template-mix>label{display:block;font-size:11px;color:var(--t2);margin-bottom:7px;font-weight:500}
.template-mix-row{display:grid;grid-template-columns:minmax(0,1fr) 76px;align-items:center;gap:8px;margin-bottom:6px}
.template-mix-row span{font-size:11px;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.template-mix-row input{width:100%;padding:6px 7px!important;text-align:right}
.template-mix-summary{margin-top:8px;padding-top:7px;border-top:1px solid var(--border);font-size:10px;color:var(--t3)}
[hidden]{display:none!important}
.del{color:var(--danger);cursor:pointer;font-size:14px;padding:2px}
.del:hover{color:#FF8855}
.statusbar{position:fixed;bottom:0;left:0;right:0;height:24px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 16px;font-size:10px;color:var(--t3);z-index:40;gap:18px}
.statusbar .item{display:flex;align-items:center;gap:5px}
.statusbar .dot{width:6px;height:6px;border-radius:50%;background:var(--t3)}
.statusbar .dot.on{background:#4ADE80}
.col-l,.col-r,.left{height:calc(100vh - 71px)!important}
.lightbox{position:fixed;inset:0;background:rgba(15,15,15,.97);display:none;align-items:center;justify-content:center;z-index:999;cursor:zoom-out}
.lightbox.show{display:flex}
.lightbox img{max-width:94vw;max-height:94vh;border-radius:4px;box-shadow:0 12px 48px rgba(0,0,0,.7)}
.lightbox .close{position:fixed;top:16px;right:24px;color:#fff;font-size:36px;cursor:pointer;z-index:1000;opacity:.6}
.lightbox .close:hover{opacity:1}
body.mobile-shell #outputPathSection{display:none}
@media (max-width:900px){
body{font-size:14px;overflow-x:hidden;padding-bottom:calc(34px + env(safe-area-inset-bottom))}
.tabs{overflow-x:auto;padding-top:env(safe-area-inset-top);scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:104px;text-align:center;padding:13px 12px}
.page.active{display:flex;flex-direction:column;min-height:calc(100dvh - 47px)}
.col-l,.col-r,.left{width:100%!important;height:auto!important;max-height:none!important;overflow:visible;border:0;padding:16px}
.col-c{order:-1;min-height:44vh;padding:16px;border-bottom:1px solid var(--border)}
.col-c .preview{width:min(72vw,330px);max-height:54vh;object-fit:contain}
.row{flex-direction:column}.cloud-actions{grid-template-columns:1fr}
.field input,.field textarea,.field select,td input,td select,td textarea,button{font-size:16px}
button{min-height:44px}
#p0 .col-r{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;background:var(--bg)}
#p0 .col-r .hist-h,#p0 .col-r>div:last-child{grid-column:1/-1}
#histList,#libList{max-height:240px;overflow:auto}
#p1 .batch-workspace{width:100%!important;overflow:visible!important;padding:16px!important}
.batch-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.batch-item img{width:100%;height:auto}
.cloud-summary{min-width:0;width:100%;padding:0 16px}.template-mix-row{grid-template-columns:minmax(0,1fr) 64px}
.statusbar{height:auto;min-height:30px;overflow-x:auto;white-space:nowrap;padding:6px 12px calc(6px + env(safe-area-inset-bottom));gap:12px}
}
@media (max-width:520px){
.col-c{min-height:38vh}.col-c .preview{width:min(82vw,300px);max-height:48vh}
#p0 .col-r{grid-template-columns:1fr}.copy-fit-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
.cloud-actions{grid-template-columns:1fr!important}
}
</style></head><body>
<div class="tabs" role="tablist" aria-label="功能页面">
  <div class="tab active" id="tab0" role="tab" aria-controls="p0" aria-selected="true" tabindex="0" data-tab-index="0" title="单条图文实时预览编辑">单条生成</div>
  <div class="tab" id="tab1" role="tab" aria-controls="p1" aria-selected="false" tabindex="-1" data-tab-index="1" title="一次生成N条差异化文案批量渲染">批量生成</div>
  <div class="tab" id="tab2" role="tab" aria-controls="p2" aria-selected="false" tabindex="-1" data-tab-index="2" title="云服务与存储路径配置">设置</div>
</div>

<div class="page active" id="p0" role="tabpanel" aria-labelledby="tab0">
  <div class="col-l">
    <h1>单条生成</h1>
    <div class="sect">模板与配色</div>
    <div class="field"><label>模板风格</label><select id="tpl"></select></div>
    <div class="field"><label>题材预设（自动填充）</label><select id="preset"></select></div>
    <div class="field"><label>配色方案</label>
    <div style="display:flex;gap:12px;align-items:center">
      <input type="color" id="color1" value="#FF8A5C" title="主色：点击拾色器选择渐变起始色">
      <div style="flex:1;height:44px;border-radius:22px;background:linear-gradient(90deg,#FF8A5C,#FF5E62);border:1px solid var(--border);transition:all .15s" id="gradPreview" title="渐变预览：实时显示主辅色渐变效果"></div>
      <input type="color" id="color2" value="#FF5E62" title="辅色：点击拾色器选择渐变结束色">
    </div></div>
    <div class="sect">内容</div>
    <div class="row">
      <div class="field"><label>序号</label><input id="num" value="01"></div>
      <div class="field"><label>标签(英文)</label><input id="tag" value="BILLIARDS"></div>
    </div>
    <div class="field"><label>标题</label><input id="title"></div>
    <div class="field"><label>正文（换行用回车）</label><textarea id="bodytxt"></textarea></div><div id="singleFitHint" class="copy-fit-hint" aria-live="polite"></div>
    <div class="field"><label>话题标签</label><input id="tags"></div>
    <div id="singleTagsFitHint" class="copy-fit-hint" aria-live="polite"></div>
    <details>
    <summary class="sect" style="cursor:pointer;list-style:none">AI生成文案</summary>
    <div class="row" style="margin-bottom:8px">
      <div class="field" style="margin:0"><label>题材</label><select id="gTheme"><option>找搭子</option><option>球房测评</option><option>新手避坑</option><option>约球吐槽</option><option>球杆科普</option><option>技术段位</option><option>球友日常</option><option>赛事战报</option></select></div>
      <div class="field" style="margin:0"><label>档位</label><select id="gLevel"><option>1档</option><option selected>2档</option><option>3档</option></select></div>
    </div>
    <div class="row" style="margin-bottom:8px">
      <div class="field" style="margin:0"><label>区域</label><input id="gRegion" value="斗门"></div>
      <div class="field" style="margin:0"><label>性格</label><select id="gPersona"><option selected>热情约球型</option><option>技术宅</option><option>吐槽役</option><option>新手求带</option><option>老炮带人</option></select></div>
    </div>
    <div class="field"><label>语气</label><select id="gTone"><option selected>口语化</option><option>略专业</option><option>搞笑自嘲</option></select></div>
    <label style="display:flex;align-items:center;gap:7px;font-size:11px;color:var(--t2);cursor:pointer;margin-bottom:10px"><input type="checkbox" id="useEmoji" style="width:auto;cursor:pointer"> 文案含表情</label>
    <button id="generatePromptButton" type="button" class="sec" style="margin-bottom:8px" title="根据上方人设配置生成提示词">生成提示词</button>
    <div class="field"><label>提示词（可编辑）</label><textarea id="promptView" style="background:var(--bg);color:#7c9;font-family:monospace;font-size:11px;min-height:80px"></textarea></div>
    <button id="singleGenerateCopyButton" type="button" style="background:var(--purple);border-color:var(--purple)" title="用提示词调API生成文案">用提示词生成文案</button>
    <div id="singleAiStatus" class="action-status" aria-live="polite"></div>
    </details>
  </div>
  <div class="col-c">
    <div class="render-badge" id="renderBadge">渲染中</div>
    <div class="hint" id="hint0">改左侧参数 · 中间实时预览</div>
    <img class="preview" id="preview0" style="display:none" alt="当前图文预览">
  </div>
  <div class="col-r">
    <div class="hist-h">渲染历史 <button id="clearHistoryButton" type="button" class="hist-clear">清空</button></div>
    <div id="histList"><div class="hist-empty">暂无历史<br>改参数自动预览</div></div>
    <div class="hist-h" style="margin-top:18px">文案库</div>
    <div id="libList"><div class="hist-empty">AI生成的文案<br>存这里可复用</div></div>
    <div style="margin-top:14px"><button id="saveRenderButton" type="button" class="sec" style="font-size:11px;padding:8px" title="将当前预览图保存到输出文件夹">保存到文件夹</button></div>
  </div>
</div>

<div class="page" id="p1" role="tabpanel" aria-labelledby="tab1">
  <div class="left">
    <h1>批量生成</h1>
    <div class="row"><div class="field"><label>题材</label><select id="bTheme"><option>找搭子</option><option>球房测评</option><option>新手避坑</option><option>约球吐槽</option><option>球杆科普</option><option>技术段位</option><option>球友日常</option><option>赛事战报</option></select></div><div class="field"><label>档位</label><select id="bLevel"><option>1档</option><option selected>2档</option><option>3档</option></select></div></div>
    <div class="row"><div class="field"><label>区域</label><input id="bRegion" value="斗门"></div><div class="field"><label>性格</label><select id="bPersona"><option selected>热情约球型</option><option>技术宅</option><option>吐槽役</option><option>新手求带</option><option>老炮带人</option></select></div></div>
    <div class="row"><div class="field"><label>语气</label><select id="bTone"><option selected>口语化</option><option>略专业</option><option>搞笑自嘲</option></select></div><div class="field"><label>生成数量</label><input id="bCount" type="number" value="10" min="1" max="100"></div></div>
    <label style="display:flex;align-items:center;gap:7px;font-size:11px;color:var(--t2);cursor:pointer;margin-bottom:10px"><input type="checkbox" id="bUseEmoji" style="width:auto;cursor:pointer"> 文案含表情</label>
    <div class="row"><div class="field"><label>模板模式</label><select id="bTplMode"><option value="single" selected>统一模板</option><option value="mix">自定义分配</option></select></div><div class="field" id="bTplUniformWrap"><label>渲染模板</label><select id="bTpl"></select></div></div>
    <div id="bTplMixWrap" class="template-mix" hidden><label>模板数量分配</label><div id="bTplMix"></div><div id="bTplMixSummary" class="template-mix-summary">总计 0 张</div></div>
    <div id="batchFitHint" class="copy-fit-hint" aria-live="polite"></div>
    <div class="field"><label>配色</label><select id="bColor"><option value="-1">随机轮换</option><option value="0">暖橙</option><option value="1">薄荷</option><option value="2">天蓝</option><option value="3">紫粉</option><option value="4">深蓝</option></select></div>
    <div class="field"><label>保存到子文件夹（可选）</label><input id="bSubfolder" placeholder="如：斗门约球0815"></div>
    <button id="batchGeneratePromptButton" type="button" class="sec" style="margin-top:10px" title="根据人设配置生成提示词">生成提示词</button>
    <div class="field" style="margin-top:8px"><label>提示词（可编辑）</label><textarea id="bPrompt" style="background:var(--bg);color:#7c9;font-family:monospace;font-size:11px;min-height:90px"></textarea></div>
    <button id="batchGenerateCopyButton" type="button" style="background:var(--purple);border-color:var(--purple)" title="一次生成N条差异化文案避免雷同">AI生成N条文案</button>
    <div id="batchAiStatus" class="action-status" aria-live="polite"></div>
    <button id="batchRenderButton" type="button" style="margin-top:8px">批量渲染出图</button>
  </div>
  <div class="batch-workspace" style="flex:1;overflow-y:auto;padding:24px"><div id="bList"></div><div class="batch-grid" id="batchGrid" style="padding:0;margin-top:20px"></div></div>
</div>

<div class="page" id="p2" role="tabpanel" aria-labelledby="tab2">
  <div class="left">

    <div id="outputPathSection" style="margin-top:22px"><div class="field"><label>图片存储路径</label><input id="outDir" placeholder="C:\Users\...\Pictures\台球图文" style="font-family:monospace"></div>
    <div style="display:flex;gap:8px"><button id="saveDirectoryButton" type="button" class="sec" style="flex:1;margin:0">保存路径</button><button id="openFolderButton" type="button" class="sec" style="flex:1;margin:0" title="在系统中打开输出文件夹">打开文件夹</button></div></div>

      <div style="display:flex;gap:8px"><button id="addAccountButton" type="button" class="sec" style="flex:1">添加账号</button><button id="saveAccountsButton" type="button" class="sec" style="flex:1">保存账号</button></div>
    </details>
  </div>
  <div class="col-c"><div class="cloud-summary"><div id="cloudSummaryTitle" style="font-size:14px;color:var(--t1);font-weight:600">未登录云服务</div><div id="cloudSummaryDetail">本地渲染与图片存储不受影响</div><div id="cloudSummarySync"></div></div></div>
</div>

<div class="statusbar">
  <div class="item"><span class="dot" id="apiDot"></span><span id="apiStat">云服务未登录</span></div>
  <div class="item">模板: <span id="statTpl" style="color:var(--t2)">-</span></div>
  <div class="item">存储: <span id="statDir" style="color:var(--t2)">-</span></div>
  <div class="item" style="margin-left:auto">已渲染: <span id="statCnt" style="color:var(--accent)">0</span></div>
</div>
<div class="lightbox" id="lightbox"><span class="close" id="lightboxClose" role="button" aria-label="关闭预览" tabindex="0">&times;</span><img id="lbImg" alt="放大预览"></div>
<script>
const tauriInvoke=window.__TAURI__?.core?.invoke;
const tauriListen=window.__TAURI__?.event?.listen;
const nativeReady=typeof tauriInvoke==="function";
const nativeInvoke=nativeReady?tauriInvoke.bind(window.__TAURI__.core):async()=>{throw new Error("本机服务不可用")};
const nativeListen=typeof tauriListen==="function"?tauriListen.bind(window.__TAURI__.event):null;
const isMobileDevice=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
document.body.classList.toggle("mobile-shell",isMobileDevice);
function saveButtonLabel(){return isMobileDevice?"保存到应用":"保存到文件夹"}
const SC=[{n:"暖橙",g1:"#FF8A5C",g2:"#FF5E62",a:"#FF5E62"},{n:"薄荷",g1:"#43E97B",g2:"#38F9D7",a:"#0FB9B1"},{n:"天蓝",g1:"#4FACFE",g2:"#00C6FB",a:"#1E90FF"},{n:"紫粉",g1:"#A18CD1",g2:"#FBC2EB",a:"#8E44AD"},{n:"深蓝",g1:"#2C3E50",g2:"#4CA1AF",a:"#3A6E8F"}];
let cur=SC[0],presets=[],tpls=[],templateMixCounts={},lastFile="",histArr=[],renderTimer=null,renderCnt=0,renderBusy=false,renderQueued=false,cloudLoggedIn=false;
function showTab(i){document.querySelectorAll('.tab').forEach((tab,index)=>{const active=index===i;tab.classList.toggle('active',active);tab.setAttribute('aria-selected',String(active));tab.tabIndex=active?0:-1});document.querySelectorAll('.page').forEach((page,index)=>page.classList.toggle('active',index===i))}
function openLightbox(src){document.getElementById("lbImg").src=src;document.getElementById("lightbox").classList.add("show")}
function closeLightbox(){document.getElementById("lightbox").classList.remove("show")}

// 配色
function updateGrad(){document.getElementById("gradPreview").style.background=`linear-gradient(90deg,${document.getElementById("color1").value},${document.getElementById("color2").value})`}
if(nativeReady){
  nativeInvoke("get_templates").then(d=>{tpls=d;["tpl","bTpl"].forEach(id=>{const sel=document.getElementById(id);if(sel)d.forEach(t=>{const o=document.createElement("option");o.value=t.id;o.textContent=t.name;sel.appendChild(o)})});renderTemplateMix();updateSingleFitHint();updateBatchFitHint()}).catch(e=>alert("模板读取失败："+e));
  nativeInvoke("get_presets").then(d=>{presets=d;const sel=document.getElementById("preset");d.forEach((p,i)=>{const o=document.createElement("option");o.value=i;o.textContent=p.name;sel.appendChild(o)});loadPreset()}).catch(e=>alert("预设读取失败："+e));
}
function loadPreset(){const p=presets[document.getElementById("preset").value];if(!p)return;document.getElementById("num").value=String(parseInt(document.getElementById("preset").value)+1).padStart(2,"0");document.getElementById("tag").value=p.tag;document.getElementById("title").value=p.title;document.getElementById("bodytxt").value=p.body;document.getElementById("tags").value=p.tags;const i=SC.findIndex(s=>s.a===p.accent);if(i>=0){cur=SC[i];document.getElementById("color1").value=SC[i].g1;document.getElementById("color2").value=SC[i].g2;updateGrad()}scheduleRender()}

// 实时预览
function scheduleRender(){updateSingleFitHint();clearTimeout(renderTimer);renderTimer=setTimeout(autoRender,600)}
async function autoRender(){if(renderBusy){renderQueued=true;return}const b={template:document.getElementById("tpl").value,num:document.getElementById("num").value,tag:document.getElementById("tag").value,title:document.getElementById("title").value,body:document.getElementById("bodytxt").value,tags:document.getElementById("tags").value,glow1:cur.g1,glow2:cur.g2,accent:cur.a};if(!b.title)return;renderBusy=true;const badge=document.getElementById("renderBadge"),hint=document.getElementById("hint0");badge.style.display="block";hint.style.display="none";try{const result=await nativeInvoke("render_preview",{request:b});document.getElementById("preview0").src="data:image/png;base64,"+result.imageBase64;document.getElementById("preview0").style.display="block";renderCnt++;document.getElementById("statCnt").textContent=renderCnt;document.getElementById("statTpl").textContent=document.getElementById("tpl").selectedOptions[0]?.text||"-"}catch(e){hint.textContent="渲染失败："+String(e);hint.style.display="block"}finally{renderBusy=false;badge.style.display="none";if(renderQueued){renderQueued=false;scheduleRender()}}}
async function loadHistory(){const h=document.getElementById("histList");if(!nativeReady){h.innerHTML="<div class='hist-empty'>历史仅在应用中可用</div>";return}try{histArr=await nativeInvoke("get_render_history");h.innerHTML="";let shown=0;for(const item of histArr){if(shown>=20)break;try{const img=await nativeInvoke("read_history_image",{historyId:item.id});const src="data:image/png;base64,"+img,d=document.createElement("div"),im=document.createElement("img");d.className="hist-item";d.title=item.fileName;im.src=src;d.appendChild(im);d.addEventListener("click",()=>openLightbox(src));h.appendChild(d);shown++}catch(_){}}if(!shown)h.innerHTML="<div class='hist-empty'>暂无已保存图片</div>"}catch(e){h.innerHTML="<div class='hist-empty'>历史读取失败</div>"}}
async function clearHist(){if(!nativeReady||!confirm("清空历史记录？已保存的图片文件不会删除。"))return;try{await nativeInvoke("clear_render_history");histArr=[];await loadHistory()}catch(e){alert("清空历史失败："+e)}}
async function saveRender(btn){const b={template:document.getElementById("tpl").value,num:document.getElementById("num").value,tag:document.getElementById("tag").value,title:document.getElementById("title").value,body:document.getElementById("bodytxt").value,tags:document.getElementById("tags").value,glow1:cur.g1,glow2:cur.g2,accent:cur.a};btn.textContent="保存中...";btn.disabled=true;try{const result=await nativeInvoke("render_save",{request:b,outputDir:null});lastFile=result.fileName;btn.textContent="已保存";await loadHistory();setTimeout(()=>{btn.textContent=saveButtonLabel()},1500)}catch(e){alert("保存失败："+String(e))}finally{btn.disabled=false;if(btn.textContent==="保存中...")btn.textContent=saveButtonLabel()}}

// AI生成
const PERSONA_GUIDES={
  "热情约球型":"外向主动、真诚招呼同城球友。开头用具体组局场景或直接邀约，正文强调好相处和一起玩的氛围，结尾主动发起约球；不要装高手。",
  "技术宅":"关注杆法、走位、发力或器材等可验证细节。围绕一个具体技术点表达观察和判断，可用少量专业词但要说清楚；结尾邀请交流打法，不要泛泛喊约球。",
  "吐槽役":"用第一人称吐槽真实球局里的尴尬和反差，短句有节奏，略犀利但不攻击球友或球房；结尾用自嘲或反问邀人一起玩。",
  "新手求带":"明确是仍在学习的萌新，从困惑、翻车或小进步切入，提出一个具体问题并真诚求带；不冒充高手，不输出权威教学。",
  "老炮带人":"表现有经验、稳当且愿意带新人，用实战经验给一条具体判断或建议，语气平等不说教；结尾表达可以带局或带练。"
};
const LEVEL_GUIDES={
  "1档":"球技处于入门阶段，可以写失误、困惑和求教，不要使用高手口吻。",
  "2档":"已有基本功和实战体验，可以表达个人判断，但不要吹嘘水平。",
  "3档":"经验较丰富，可以谈策略和技术细节，但保持克制，不端着教育别人。"
};
const TONE_GUIDES={
  "口语化":"像发给本地球友的消息，多用自然短句，不写宣传稿。",
  "略专业":"表达清楚、术语准确，每次只讲一个重点，普通球友也能看懂。",
  "搞笑自嘲":"用具体反差制造笑点，主要调侃自己，不刻薄别人。"
};
const DEFAULT_COPY_LIMITS={titleChars:30,bodyChars:96,bodyLines:6,tagsCount:3,tagChars:12};
const FALLBACK_TEMPLATE_LIMITS={magazine:{titleChars:30,bodyChars:96,bodyLines:6,tagsCount:3,tagChars:12},magazine_pro:{titleChars:30,bodyChars:112,bodyLines:7,tagsCount:3,tagChars:12},fresh:{titleChars:30,bodyChars:112,bodyLines:7,tagsCount:3,tagChars:12},minimal:{titleChars:30,bodyChars:136,bodyLines:8,tagsCount:3,tagChars:12},poster:{titleChars:30,bodyChars:144,bodyLines:8,tagsCount:3,tagChars:12},journal:{titleChars:30,bodyChars:112,bodyLines:7,tagsCount:3,tagChars:12}};
function copyLimitsForTemplate(template){const item=tpls.find(t=>t.id===template);return item?.copyLimits||FALLBACK_TEMPLATE_LIMITS[template]||DEFAULT_COPY_LIMITS}
function templateNameFor(template){return tpls.find(t=>t.id===template)?.name||({magazine:"高级杂志风",magazine_pro:"杂志风Pro",fresh:"清新卡片风",minimal:"极简留白风",poster:"深色海报风",journal:"手账贴纸风"})[template]||"当前模板"}
function visibleLen(value){return [...String(value||"").replace(/\s/g,"")].length}
function tagParts(value){return String(value||"").split(/\s+/).map(v=>v.trim()).filter(Boolean)}
function activeBatchTemplate(){if(document.getElementById("bTplMode").value!=="mix")return document.getElementById("bTpl").value||"magazine";const selected=tpls.filter(t=>(Number(templateMixCounts[t.id])||0)>0);const list=selected.length?selected:tpls;return (list.slice().sort((a,b)=>copyLimitsForTemplate(a.id).bodyChars-copyLimitsForTemplate(b.id).bodyChars)[0]?.id)||document.getElementById("bTpl").value||"magazine"}
function activePromptTemplate(prefix){return prefix==="g"?(document.getElementById("tpl").value||"magazine"):activeBatchTemplate()}
function fitReport(title,body,tags,template){const limits=copyLimitsForTemplate(template),tagList=tagParts(tags),bodyLines=String(body||"").split(/\n/).filter(v=>v.trim()).length;const titleLen=visibleLen(title),bodyLen=visibleLen(body),tagOver=tagList.some(tag=>visibleLen(tag)>limits.tagChars),over=titleLen>limits.titleChars||bodyLen>limits.bodyChars||bodyLines>limits.bodyLines||tagList.length>limits.tagsCount||tagOver;return{limits,titleLen,bodyLen,bodyLines,tagCount:tagList.length,tagOver,over,template}}
function fitText(report){const l=report.limits;return `标题 ${report.titleLen}/${l.titleChars}，正文 ${report.bodyLen}/${l.bodyChars} 字、${report.bodyLines}/${l.bodyLines} 行，话题 ${report.tagCount}/${l.tagsCount}${report.tagOver?"（单个过长）":""}`}
function metricChip(label,value,over){const chip=document.createElement("span");chip.className="copy-fit-chip"+(over?" over":"");chip.textContent=`${label} ${value}`;return chip}
function setFitHint(id,report,prefix="",detail=""){const el=document.getElementById(id);if(!el)return;el.className="copy-fit-hint "+(report.over?"error":"ok");const head=document.createElement("div"),title=document.createElement("span"),badge=document.createElement("span"),metrics=document.createElement("div");head.className="copy-fit-head";title.className="copy-fit-title";badge.className="copy-fit-badge";metrics.className="copy-fit-metrics";title.textContent=prefix||"模板容量";badge.textContent=report.over?"需处理":"适配";const l=report.limits;metrics.append(metricChip("标题",`${report.titleLen}/${l.titleChars}`,report.titleLen>l.titleChars),metricChip("正文",`${report.bodyLen}/${l.bodyChars}字`,report.bodyLen>l.bodyChars),metricChip("行数",`${report.bodyLines}/${l.bodyLines}`,report.bodyLines>l.bodyLines),metricChip("话题",`${report.tagCount}/${l.tagsCount}`,report.tagCount>l.tagsCount||report.tagOver));head.append(title,badge);el.replaceChildren(head,metrics);if(detail){const note=document.createElement("div");note.className="copy-fit-detail";note.textContent=detail;el.appendChild(note)}}
function fieldFitState(value,limit,hardOver=false){if(hardOver)return"error";return limit>0&&value/limit>=.85?"warn":""}
function markFitField(input,state){if(!input)return;input.classList.remove("fit-warn","fit-error");if(state)input.classList.add("fit-"+state);input.setAttribute("aria-invalid",state==="error"?"true":"false")}
function updateSingleFitFields(report){const l=report.limits;markFitField(document.getElementById("title"),fieldFitState(report.titleLen,l.titleChars,report.titleLen>l.titleChars));markFitField(document.getElementById("bodytxt"),fieldFitState(Math.max(report.bodyLen/l.bodyChars,report.bodyLines/l.bodyLines),1,report.bodyLen>l.bodyChars||report.bodyLines>l.bodyLines));markFitField(document.getElementById("tags"),fieldFitState(Math.max(report.tagCount/l.tagsCount,report.tagOver?1.1:0),1,report.tagCount>l.tagsCount||report.tagOver))}
function updateSingleFitHint(){const template=document.getElementById("tpl")?.value||"magazine",report=fitReport(document.getElementById("title")?.value,document.getElementById("bodytxt")?.value,document.getElementById("tags")?.value,template);setFitHint("singleFitHint",report,templateNameFor(template),report.over?"超出时会先自动缩小正文，仍放不下才省略；建议手动缩短。":"当前内容适配模板。");updateSingleFitFields(report);const tagHint=document.getElementById("singleTagsFitHint");if(tagHint){tagHint.textContent=report.over?"建议优先压缩正文和话题标签，避免成图信息被省略。":"AI 生成会按当前模板容量收口。";tagHint.className="copy-fit-hint "+(report.over?"warn":"ok")}}
function batchOverfitCount(){const items=[...document.querySelectorAll("#bList .bi-item")];return{items,over:items.filter(item=>item.dataset.fitOver==="1")}}
function updateBatchFitHint(){const template=activeBatchTemplate(),summary=batchOverfitCount(),report={...fitReport("","","",template),over:summary.over.length>0},detail=summary.items.length?`${summary.items.length-summary.over.length}/${summary.items.length} 条适配${summary.over.length?`，${summary.over.length} 条建议缩短后再渲染。`:"。"}`:"AI 生成会按此模板容量收口；混合模板时按最保守模板估算。";setFitHint("batchFitHint",report,templateNameFor(template),detail)}
function refreshBatchItemFits(){const template=activeBatchTemplate();document.querySelectorAll("#bList .bi-item").forEach(item=>item.refreshFit?.(template));updateBatchFitHint()}
function attachBatchFit(card,template,titleInput,bodyInput,tagsInput){const fit=document.createElement("div");fit.className="bi-fit";const refresh=(nextTemplate=template,updateSummary=true)=>{const report=fitReport(titleInput.value,bodyInput.value,tagsInput.value,nextTemplate);card.dataset.fitOver=report.over?"1":"0";card.dataset.fitTemplate=nextTemplate;card.classList.toggle("overfit",report.over);fit.textContent=fitText(report);fit.className="bi-fit "+(report.over?"error":"ok");if(updateSummary)updateBatchFitHint()};card.refreshFit=nextTemplate=>refresh(nextTemplate,false);[titleInput,bodyInput,tagsInput].forEach(input=>input.addEventListener("input",()=>refresh()));refresh();return fit}
function buildCopyPrompt(prefix){const template=activePromptTemplate(prefix),limits=copyLimitsForTemplate(template),templateName=templateNameFor(template),emojiId=prefix==="g"?"useEmoji":prefix+"UseEmoji",emoji=document.getElementById(emojiId).checked?"可适当使用1-2个emoji增加生动感":"不要使用任何emoji",persona=document.getElementById(prefix+"Persona").value,level=document.getElementById(prefix+"Level").value,region=document.getElementById(prefix+"Region").value.trim()||"未指定地区",tone=document.getElementById(prefix+"Tone").value,theme=document.getElementById(prefix+"Theme").value;return `你是抖音同城台球约球博主，请以固定账号人设生成图文内容。\n\n【账号人设】\n区域：${region}\n档位：${level}\n档位表现：${LEVEL_GUIDES[level]}\n性格：${persona}\n性格表现：${PERSONA_GUIDES[persona]}\n语气：${tone}\n语气表现：${TONE_GUIDES[tone]}\n\n【题材】\n${theme}\n\n【模板承载】\n当前模板：${templateName}\n标题≤${limits.titleChars}字；正文≤${limits.bodyChars}字且最多${limits.bodyLines}行；话题最多${limits.tagsCount}个，每个≤${limits.tagChars}字。宁可短一点，不要撑满或超出模板。\n\n【硬性要求】\n1. 必须通过开头视角、关注点、措辞和结尾动作体现“${persona}”，不要只写一句自我标签。\n2. 正文像真人发的，有具体场景、个人情绪和观点，别写广告腔或模板腔。\n3. 带1-${limits.tagsCount}个相关话题标签。\n4. 结尾自然引导进约球群，可用“进群”“群里”，不要出现微信号、二维码、加V等导流词。\n5. ${emoji}。`}
function setPromptValue(output,prompt){output.value=prompt;output.dispatchEvent(new Event("input",{bubbles:true}));output.classList.add("prompt-generated");window.setTimeout(()=>output.classList.remove("prompt-generated"),1200)}
function writeGeneratedPrompt(outputId,prompt,button){const output=document.getElementById(outputId);setPromptValue(output,prompt);output.scrollIntoView({block:"nearest"});button.textContent="已生成";window.setTimeout(()=>button.textContent="生成提示词",1200)}
function updPrompt(button=document.getElementById("generatePromptButton")){writeGeneratedPrompt("promptView",buildCopyPrompt("g"),button)}
function refreshPromptFromConfig(prefix,outputId){const output=document.getElementById(outputId);if(output.value.trim())setPromptValue(output,buildCopyPrompt(prefix))}
function setActionStatus(id,message,state=""){const status=document.getElementById(id);status.textContent=message;status.className="action-status"+(state?" "+state:"")}
async function aiGen(btn=document.getElementById("singleGenerateCopyButton")){const promptField=document.getElementById("promptView"),prompt=promptField.value.trim();if(!prompt){setActionStatus("singleAiStatus","请先生成提示词","error");promptField.focus();return}if(!nativeReady){setActionStatus("singleAiStatus","请在应用中使用 AI 生成","error");return}if(!cloudLoggedIn){setActionStatus("singleAiStatus","请先在设置页登录云服务","error");return}btn.textContent="生成中...";btn.disabled=true;setActionStatus("singleAiStatus","AI 正在生成文案，请稍候");try{const item=await nativeInvoke("generate_copy",{prompt,template:document.getElementById("tpl").value});document.getElementById("title").value=item.title;document.getElementById("bodytxt").value=item.body;document.getElementById("tags").value=item.tags;const theme=document.getElementById("gTheme").value;document.getElementById("tag").value=({找搭子:"BILLIARDS",球房测评:"REVIEW",新手避坑:"GUIDE",约球吐槽:"RANT",球杆科普:"PRO TIP",技术段位:"RANK",球友日常:"DAILY",赛事战报:"MATCH"})[theme]||"BILLIARDS";await addLib(item.title,item.body,item.tags);scheduleRender();updateSingleFitHint();setActionStatus("singleAiStatus","生成完成，内容已填入标题和正文","success");document.getElementById("title").scrollIntoView({block:"center"})}catch(e){setActionStatus("singleAiStatus","生成失败："+String(e),"error");if(String(e).includes("重新登录"))await loadCloudStatus()}finally{btn.textContent="用提示词生成文案";btn.disabled=false}}

// 批量
const TAGMAP={"找搭子":"BILLIARDS","球房测评":"REVIEW","新手避坑":"GUIDE","约球吐槽":"RANT","球杆科普":"PRO TIP","技术段位":"RANK","球友日常":"DAILY","赛事战报":"MATCH"};
function tplOpts(sel){return tpls.map(t=>`<option value="${t.id}"${sel==t.id?' selected':''}>${t.name}</option>`).join("")}
function templateMixTotal(){return tpls.reduce((sum,t)=>sum+(Number(templateMixCounts[t.id])||0),0)}
function batchExpectedCount(){const generated=document.querySelectorAll("#bList .bi-item").length;return generated||Math.min(100,Math.max(1,parseInt(document.getElementById("bCount").value)||10))}
function updateTemplateMixSummary(){const summary=document.getElementById("bTplMixSummary");if(!summary)return;const total=templateMixTotal(),expected=batchExpectedCount();summary.textContent=`总计 ${total} 张（当前文案数 ${expected} 张）`;summary.style.color=total===expected?"var(--accent)":"var(--danger)";refreshBatchItemFits()}
function renderTemplateMix(){const list=document.getElementById("bTplMix");if(!list||!tpls.length)return;const expected=batchExpectedCount();const hasCounts=Object.values(templateMixCounts).some(value=>Number(value)>0);if(!hasCounts)templateMixCounts[tpls[0].id]=expected;list.innerHTML="";tpls.forEach(t=>{const row=document.createElement("div"),label=document.createElement("span"),input=document.createElement("input");row.className="template-mix-row";label.textContent=t.name;label.title=t.name;input.type="number";input.min="0";input.max="100";input.step="1";input.value=String(Number(templateMixCounts[t.id])||0);input.setAttribute("aria-label",t.name+"数量");input.addEventListener("input",()=>{const value=Math.min(100,Math.max(0,parseInt(input.value)||0));input.value=String(value);templateMixCounts[t.id]=value;updateTemplateMixSummary()});row.appendChild(label);row.appendChild(input);list.appendChild(row)});updateTemplateMixSummary()}
function setBatchTemplateMode(){const mix=document.getElementById("bTplMode").value==="mix";document.getElementById("bTplUniformWrap").hidden=mix;document.getElementById("bTplMixWrap").hidden=!mix;if(mix)renderTemplateMix();refreshBatchItemFits();refreshPromptFromConfig("b","bPrompt")}
function batchTemplatePlan(itemCount){if(document.getElementById("bTplMode").value!=="mix")return{templates:Array.from({length:itemCount},()=>document.getElementById("bTpl").value)};const total=templateMixTotal();if(total!==itemCount)return{error:`自定义模板分配共 ${total} 张，但当前有 ${itemCount} 条文案，请调整数量后再渲染。`};const templates=[];tpls.forEach(t=>{for(let i=0;i<(Number(templateMixCounts[t.id])||0);i++)templates.push(t.id)});return{templates}}
function bGenPrompt(button=document.getElementById("batchGeneratePromptButton")){writeGeneratedPrompt("bPrompt",buildCopyPrompt("b"),button)}
async function bGen(btn=document.getElementById("batchGenerateCopyButton")){const promptField=document.getElementById("bPrompt"),prompt=promptField.value.trim();if(!prompt){setActionStatus("batchAiStatus","请先生成提示词","error");promptField.focus();return}if(!nativeReady){setActionStatus("batchAiStatus","请在应用中使用 AI 生成","error");return}if(!cloudLoggedIn){setActionStatus("batchAiStatus","请先在设置页登录云服务","error");return}const template=activeBatchTemplate(),count=Math.min(100,Math.max(1,parseInt(document.getElementById("bCount").value)||10));btn.textContent="生成中...";btn.disabled=true;setActionStatus("batchAiStatus","AI 正在生成 "+count+" 条文案，请稍候");const list=document.getElementById("bList");list.innerHTML="<div class='hint'>AI生成"+count+"条中...</div>";try{const items=await nativeInvoke("generate_batch_copy",{prompt,count,template});list.innerHTML="<div style='color:var(--accent);font-size:12px;margin-bottom:10px'>生成"+items.length+"条，可编辑后批量渲染</div>";items.forEach((it,i)=>{const d=document.createElement("div");d.className="bi-item";d.style.cssText="background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:12px;margin-bottom:10px";const h=document.createElement("div");h.style.cssText="font-size:11px;color:var(--accent);margin-bottom:6px";h.textContent="第"+(i+1)+"条";const t=document.createElement("input");t.className="bi-title";t.value=it.title;t.style.cssText="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--t1);padding:6px;border-radius:3px;font-size:12px;margin-bottom:6px";const b=document.createElement("textarea");b.className="bi-body";b.value=it.body;b.style.cssText="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--t1);padding:6px;border-radius:3px;font-size:12px;min-height:60px;margin-bottom:6px;resize:vertical";const g=document.createElement("input");g.className="bi-tags";g.value=it.tags;g.style.cssText="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--t1);padding:6px;border-radius:3px;font-size:12px";d.appendChild(h);d.appendChild(t);d.appendChild(b);d.appendChild(g);d.appendChild(attachBatchFit(d,template,t,b,g));list.appendChild(d)});updateTemplateMixSummary();updateBatchFitHint();setActionStatus("batchAiStatus","已生成 "+items.length+" 条文案","success")}catch(e){list.innerHTML="";setActionStatus("batchAiStatus","批量生成失败："+String(e),"error");if(String(e).includes("重新登录"))await loadCloudStatus()}finally{btn.textContent="AI生成N条文案";btn.disabled=false}}
async function bRender(){
  const items=[...document.querySelectorAll("#bList .bi-item")];
  if(!items.length){alert("请先生成文案");return}
  if(!nativeReady){alert("批量渲染仅在应用中可用");return}
  const sourceItems=items.filter(item=>item.querySelector(".bi-title").value.trim()).slice(0,100),plan=batchTemplatePlan(sourceItems.length),overItems=sourceItems.filter(item=>item.dataset.fitOver==="1");
  if(plan.error){setActionStatus("batchAiStatus",plan.error,"error");alert(plan.error);return}if(overItems.length&&!confirm(`有 ${overItems.length} 条文案超过当前模板容量，渲染时可能自动缩小或省略。仍继续渲染？`)){setActionStatus("batchAiStatus",`已暂停：${overItems.length} 条文案建议先缩短`,"error");return}
  const ci=parseInt(document.getElementById("bColor").value),theme=document.getElementById("bTheme").value;
  const reqs=sourceItems.map((d,i)=>{const c=ci>=0?ci:i%5;return{template:plan.templates[i],num:String(i+1).padStart(2,"0"),tag:TAGMAP[theme]||"BILLIARDS",title:d.querySelector(".bi-title").value,body:d.querySelector(".bi-body").value,tags:d.querySelector(".bi-tags").value,glow1:SC[c].g1,glow2:SC[c].g2,accent:SC[c].a,subfolder:document.getElementById("bSubfolder").value.trim()}});
  if(!reqs.length){alert("请至少保留一条有标题的文案");return}
  const g=document.getElementById("batchGrid");g.innerHTML="";const bar=document.createElement("div");bar.style.cssText="width:100%;background:var(--bg3);border-radius:4px;height:28px;margin-bottom:16px;overflow:hidden;position:relative;position:sticky;top:0;z-index:9";const fill=document.createElement("div");fill.style.cssText="height:100%;background:var(--accent);width:0%;transition:width .3s";const txt=document.createElement("div");txt.style.cssText="position:absolute;top:0;left:0;right:0;text-align:center;line-height:28px;font-size:11px;color:#fff;font-weight:600";txt.textContent=`渲染中 0/${reqs.length}`;bar.appendChild(fill);bar.appendChild(txt);g.appendChild(bar);const removers=[];let failures=[];try{if(nativeListen){removers.push(await nativeListen("job-progress",e=>{const p=e.payload;fill.style.width=Math.round(p.completed/p.total*100)+"%";txt.textContent=`渲染中 ${p.completed}/${p.total}`}),await nativeListen("job-failed",e=>{const p=e.payload;failures.push(`第${p.completed}张：${p.error}`);fill.style.width=Math.round(p.completed/p.total*100)+"%";txt.textContent=`已处理 ${p.completed}/${p.total}，失败 ${failures.length}`}),await nativeListen("job-complete",e=>{const p=e.payload;txt.textContent=`完成 ${p.succeeded}/${p.total}`}))}const results=await nativeInvoke("render_batch",{requests:reqs,outputDir:null}),recent=await nativeInvoke("get_render_history");for(const item of recent.slice(0,Math.min(results.length,24))){try{const data=await nativeInvoke("read_history_image",{historyId:item.id});const card=document.createElement("div"),img=document.createElement("img"),open=document.createElement("a");card.className="batch-item";img.src="data:image/png;base64,"+data;img.addEventListener("click",()=>openLightbox(img.src));open.className="dl";open.textContent="目录";open.addEventListener("click",event=>{event.preventDefault();openFolder()});card.appendChild(img);card.appendChild(open);g.appendChild(card)}catch(_){}}fill.style.width="100%";txt.textContent=`完成 ${results.length}/${reqs.length}`;if(failures.length)alert("部分图片渲染失败：\n"+failures.slice(0,5).join("\n"));await loadHistory()}catch(e){txt.textContent="批量渲染失败";alert("批量渲染失败："+e)}finally{removers.forEach(remove=>remove())}}

// 设置
async function addLib(title,body,tags){try{await nativeInvoke("save_copy_library",{item:{title,body,tags}});await renderLib()}catch(e){alert("文案保存失败："+e)}}
async function renderLib(){let arr=[];try{arr=await nativeInvoke("get_copy_library")}catch(e){document.getElementById("libList").innerHTML="<div class='hist-empty'>文案库读取失败</div>";return}const el=document.getElementById("libList");if(!arr.length){el.innerHTML="<div class='hist-empty'>AI生成的文案<br>存这里可复用</div>";return}el.innerHTML="";arr.forEach(it=>{const d=document.createElement("div"),title=document.createElement("div"),body=document.createElement("div");d.style.cssText="padding:8px;border:1px solid var(--border);border-radius:4px;margin-bottom:5px;cursor:pointer;font-size:11px;transition:all .15s";title.style.cssText="color:var(--t1);margin-bottom:3px;font-weight:500";body.style.cssText="color:var(--t3);font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis";title.textContent=it.title;body.textContent=it.body;d.appendChild(title);d.appendChild(body);d.addEventListener("mouseenter",()=>d.style.borderColor="var(--accent)");d.addEventListener("mouseleave",()=>d.style.borderColor="var(--border)");d.addEventListener("click",()=>{document.getElementById("title").value=it.title;document.getElementById("bodytxt").value=it.body;document.getElementById("tags").value=it.tags;scheduleRender()});el.appendChild(d)})}
function cloudTime(value){if(!value)return "尚未同步";try{return "上次同步："+new Date(value*1000).toLocaleString()}catch(_){return "尚未同步"}}
function applyCloudStatus(status){cloudLoggedIn=status.loggedIn===true;const dot=document.getElementById("apiDot"),stat=document.getElementById("apiStat"),cloudStatus=document.getElementById("cloudStatus"),title=document.getElementById("cloudSummaryTitle"),detail=document.getElementById("cloudSummaryDetail"),sync=document.getElementById("cloudSummarySync"),logout=document.getElementById("cloudLogoutButton"),upload=document.getElementById("cloudUploadButton"),download=document.getElementById("cloudDownloadButton");dot.classList.toggle("on",cloudLoggedIn);stat.textContent=cloudLoggedIn?"云服务已登录":"云服务未登录";document.getElementById("cloudServerUrl").value=status.serverUrl||"";if(status.email&&!document.getElementById("cloudEmail").value)document.getElementById("cloudEmail").value=status.email;title.textContent=cloudLoggedIn?(status.email||"已登录云服务"):"未登录云服务";detail.textContent=status.serverConfigured?(status.serverUrl+(cloudLoggedIn?"":"，等待登录")):"请配置服务器地址";sync.textContent=cloudTime(status.lastSyncAt);[logout,upload,download].forEach(button=>{button.disabled=false;button.title=cloudLoggedIn?"":"请先登录云服务"});if(cloudStatus&&!cloudStatus.textContent)cloudStatus.textContent=cloudLoggedIn?"云端功能可用":""}
async function loadCloudStatus(){try{const status=await nativeInvoke("get_cloud_status");applyCloudStatus(status)}catch(e){document.getElementById("cloudStatus").textContent="云服务状态读取失败："+String(e)}}
async function saveCloudServer(showMessage=true){const value=document.getElementById("cloudServerUrl").value.trim();if(!value){setActionStatus("cloudStatus","请填写服务器地址","error");return false}try{const status=await nativeInvoke("set_cloud_server_url",{serverUrl:value});applyCloudStatus(status);if(showMessage)setActionStatus("cloudStatus","服务器地址已保存","success");return true}catch(e){setActionStatus("cloudStatus",String(e),"error");return false}}
async function testCloud(){const button=document.getElementById("testCloudButton");button.disabled=true;button.textContent="测试中...";try{if(!await saveCloudServer(false))return;const message=await nativeInvoke("test_cloud_connection");setActionStatus("cloudStatus",message,"success")}catch(e){setActionStatus("cloudStatus",String(e),"error")}finally{button.disabled=false;button.textContent="测试连接"}}
async function cloudAuth(mode){const email=document.getElementById("cloudEmail").value.trim(),password=document.getElementById("cloudPassword").value;const button=document.getElementById(mode==="login"?"cloudLoginButton":"cloudRegisterButton");if(!email||!password){setActionStatus("cloudStatus","请输入邮箱和密码","error");return}button.disabled=true;button.textContent=mode==="login"?"登录中...":"注册中...";try{if(!await saveCloudServer(false))return;const status=await nativeInvoke(mode==="login"?"cloud_login":"cloud_register",{email,password});applyCloudStatus(status);document.getElementById("cloudPassword").value="";setActionStatus("cloudStatus",mode==="login"?"登录成功，请选择同步方向":"注册成功，请选择同步方向","success")}catch(e){setActionStatus("cloudStatus",String(e),"error")}finally{button.disabled=false;button.textContent=mode==="login"?"登录":"注册"}}
async function cloudLogout(){if(!cloudLoggedIn){setActionStatus("cloudStatus","当前未登录云服务","error");return}const button=document.getElementById("cloudLogoutButton");button.disabled=true;try{const status=await nativeInvoke("cloud_logout");applyCloudStatus(status);setActionStatus("cloudStatus","已退出登录","success")}catch(e){setActionStatus("cloudStatus",String(e),"error")}finally{button.disabled=false}}
function collectAccounts(){return[...document.querySelectorAll("#accountRows tr")].map(row=>{const data={cloudId:row.dataset.cloudId||null,persona:row.dataset.persona||"热情约球型",tone:row.dataset.tone||"口语化",status:row.dataset.status||"养号中"};row.querySelectorAll("input").forEach(input=>data[input.dataset.key]=input.value.trim());return data}).filter(account=>account.name)}
async function cloudUpload(){if(!cloudLoggedIn){setActionStatus("cloudSyncStatus","请先登录云服务","error");return}if(!confirm("上传本机账号和文案库，覆盖云端同类数据？"))return;try{await nativeInvoke("set_accounts",{accounts:collectAccounts()});const result=await nativeInvoke("cloud_sync_upload");setActionStatus("cloudSyncStatus",`已上传 ${result.accounts} 个账号、${result.copyItems} 条文案`,"success");await loadCloudStatus()}catch(e){setActionStatus("cloudSyncStatus","上传失败："+String(e),"error")}}
async function cloudDownload(){if(!cloudLoggedIn){setActionStatus("cloudSyncStatus","请先登录云服务","error");return}if(!confirm("下载云端数据会替换本机账号和文案库，图片历史与输出目录不受影响。继续？"))return;try{const result=await nativeInvoke("cloud_sync_download");setActionStatus("cloudSyncStatus",`已下载 ${result.accounts} 个账号、${result.copyItems} 条文案`,"success");await Promise.all([loadSettings(),loadAccounts(),renderLib(),loadCloudStatus()])}catch(e){setActionStatus("cloudSyncStatus","下载失败："+String(e),"error")}}
async function saveDir(){const outputDir=document.getElementById("outDir").value.trim();if(!outputDir){alert("请输入路径");return}try{await nativeInvoke("set_settings",{settings:{output_dir:outputDir}});await loadSettings();alert("路径已保存")}catch(e){alert("目录不可用："+e)}}
async function openFolder(){try{await nativeInvoke("open_output_folder",{path:null})}catch(e){alert("打开目录失败："+e)}}
async function loadSettings(){try{const s=await nativeInvoke("get_settings"),label=isMobileDevice?"应用内":(s.output_dir||"output").split(/[\\/]/).pop();document.getElementById("statDir").textContent=label;if(!isMobileDevice&&s.output_dir)document.getElementById("outDir").value=s.output_dir}catch(e){setActionStatus("cloudStatus","设置读取失败："+String(e),"error")}}
function accountRow(account={name:"",region:"斗门",level:"2档",persona:"热情约球型",tone:"口语化",status:"养号中"}){const tr=document.createElement("tr");for(const key of ["name","region","level"]){const td=document.createElement("td"),input=document.createElement("input");input.dataset.key=key;input.value=account[key]||"";td.appendChild(input);tr.appendChild(td)}const td=document.createElement("td"),del=document.createElement("span");del.className="del";del.textContent="×";del.title="删除账号";del.addEventListener("click",()=>tr.remove());td.appendChild(del);tr.appendChild(td);tr.dataset.cloudId=account.cloudId||"";tr.dataset.persona=account.persona||"";tr.dataset.tone=account.tone||"";tr.dataset.status=account.status||"";return tr}
function addAccount(){document.getElementById("accountRows").appendChild(accountRow())}
async function loadAccounts(){try{const accounts=await nativeInvoke("get_accounts"),rows=document.getElementById("accountRows");rows.innerHTML="";accounts.forEach(account=>rows.appendChild(accountRow(account)))}catch(e){document.getElementById("accountRows").innerHTML="";setActionStatus("cloudStatus","账号配置读取失败："+String(e),"error")}}
async function saveAccounts(){try{await nativeInvoke("set_accounts",{accounts:collectAccounts()});alert("账号配置已保存")}catch(e){alert("账号配置保存失败："+e)}}
async function migrateLegacy(){try{await nativeInvoke("migrate_legacy");const parsed=JSON.parse(localStorage.getItem("lib")||"[]"),items=Array.isArray(parsed)?parsed:[];await nativeInvoke("migrate_copy_library",{items});localStorage.removeItem("lib")}catch(e){setActionStatus("cloudStatus","旧版数据迁移失败："+String(e),"error")}}
function applyPlatformHints(){const saveButton=document.getElementById("saveRenderButton"),openFolderButton=document.getElementById("openFolderButton");if(saveButton)saveButton.textContent=saveButtonLabel();if(isMobileDevice&&openFolderButton)openFolderButton.disabled=true}
function bindStaticEvents(){
  applyPlatformHints();
  document.querySelectorAll(".tab").forEach(tab=>{tab.addEventListener("click",()=>showTab(Number(tab.dataset.tabIndex)));tab.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();tab.click()}})});
  document.getElementById("tpl").addEventListener("change",()=>{scheduleRender();refreshPromptFromConfig("g","promptView")});
  document.getElementById("preset").addEventListener("change",loadPreset);
  ["num","tag","title","bodytxt","tags"].forEach(id=>document.getElementById(id).addEventListener("input",scheduleRender));updateSingleFitHint();updateBatchFitHint();
  document.getElementById("color1").addEventListener("change",event=>{cur={...cur,g1:event.target.value,a:event.target.value};updateGrad();scheduleRender()});
  document.getElementById("color2").addEventListener("change",event=>{cur={...cur,g2:event.target.value};updateGrad();scheduleRender()});
  document.getElementById("preview0").addEventListener("click",event=>openLightbox(event.currentTarget.src));
  document.getElementById("clearHistoryButton").addEventListener("click",clearHist);
  document.getElementById("saveRenderButton").addEventListener("click",event=>saveRender(event.currentTarget));
  document.getElementById("generatePromptButton").addEventListener("click",event=>updPrompt(event.currentTarget));
  document.getElementById("singleGenerateCopyButton").addEventListener("click",event=>aiGen(event.currentTarget));
  document.getElementById("batchGeneratePromptButton").addEventListener("click",event=>bGenPrompt(event.currentTarget));
  document.getElementById("batchGenerateCopyButton").addEventListener("click",event=>bGen(event.currentTarget));
  ["gTheme","gLevel","gPersona","gTone","useEmoji"].forEach(id=>document.getElementById(id).addEventListener("change",()=>refreshPromptFromConfig("g","promptView")));
  document.getElementById("gRegion").addEventListener("input",()=>refreshPromptFromConfig("g","promptView"));
  ["bTheme","bLevel","bPersona","bTone","bUseEmoji"].forEach(id=>document.getElementById(id).addEventListener("change",()=>refreshPromptFromConfig("b","bPrompt")));
  document.getElementById("bRegion").addEventListener("input",()=>refreshPromptFromConfig("b","bPrompt"));
  document.getElementById("bTplMode").addEventListener("change",setBatchTemplateMode);document.getElementById("bTpl").addEventListener("change",()=>{refreshBatchItemFits();refreshPromptFromConfig("b","bPrompt")});
  document.getElementById("bCount").addEventListener("input",()=>{updateTemplateMixSummary();refreshPromptFromConfig("b","bPrompt")});
  document.getElementById("batchRenderButton").addEventListener("click",bRender);
  document.getElementById("saveCloudServerButton").addEventListener("click",()=>saveCloudServer());
  document.getElementById("testCloudButton").addEventListener("click",testCloud);
  document.getElementById("cloudLoginButton").addEventListener("click",()=>cloudAuth("login"));
  document.getElementById("cloudRegisterButton").addEventListener("click",()=>cloudAuth("register"));
  document.getElementById("cloudLogoutButton").addEventListener("click",cloudLogout);
  document.getElementById("cloudUploadButton").addEventListener("click",cloudUpload);
  document.getElementById("cloudDownloadButton").addEventListener("click",cloudDownload);
  document.getElementById("saveDirectoryButton").addEventListener("click",saveDir);
  document.getElementById("openFolderButton").addEventListener("click",openFolder);
  document.getElementById("addAccountButton").addEventListener("click",addAccount);
  document.getElementById("saveAccountsButton").addEventListener("click",saveAccounts);
  const lightbox=document.getElementById("lightbox"),close=document.getElementById("lightboxClose");
  lightbox.addEventListener("click",event=>{if(event.target===lightbox||event.target===close)closeLightbox()});
  close.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();closeLightbox()}});
  document.addEventListener("keydown",event=>{if(event.key==="Escape")closeLightbox()});
}
bindStaticEvents();
if(nativeReady){migrateLegacy().then(()=>Promise.all([loadSettings(),loadCloudStatus(),loadAccounts(),loadHistory(),renderLib()]))}else{setActionStatus("cloudStatus","本机服务不可用","error");loadHistory()}
</script></body></html>
