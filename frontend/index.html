<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>台球图文生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif}
:root{--bg:#141816;--bg2:#191F1B;--bg3:#202820;--bg4:#2A342A;--panel:#1C241F;--panel2:#243029;--field:#101412;--rail:#3B2818;--rail2:#53391F;--felt:#1F6B45;--felt2:#2E8A58;--chalk:#D8E6DC;--brass:#C7A45B;--border:#314138;--border2:#43584C;--border3:#607264;--t1:#F3F1E8;--t2:#C8D1C8;--t3:#879287;--accent:#2E8A58;--accent-h:#36A56A;--accent-soft:rgba(46,138,88,.18);--danger:#D86B5F;--warning:#C7A45B;--success:#3FA56F;--purple:#2E8A58;--radius:7px;--shadow:0 14px 34px rgba(0,0,0,.34)}
body{background:linear-gradient(90deg,rgba(83,57,31,.26) 0,rgba(83,57,31,.08) 1px,transparent 1px),linear-gradient(180deg,#101411,var(--bg));background-size:42px 100%,auto;color:var(--t1);min-height:100vh;font-size:13px;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#48584C;border:3px solid var(--bg);border-radius:999px}::-webkit-scrollbar-thumb:hover{background:#607264}
.tabs{display:flex;background:linear-gradient(180deg,#2C1E13,#1A1511);padding:0 12px;border-bottom:1px solid rgba(199,164,91,.28);position:sticky;top:0;z-index:50;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.tab{position:relative;padding:15px 18px;cursor:pointer;color:var(--t2);font-size:12px;font-weight:600;border-bottom:0;transition:color .15s,background .15s;border-right:0;border-radius:0;letter-spacing:.1px}
.tab:hover{color:var(--t1);background:rgba(199,164,91,.08)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.tab.active{color:#fff;background:transparent}
.tab.active:after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:3px;background:var(--brass);border-radius:3px 3px 0 0}
.page{display:none}.page.active{display:flex}
.left{width:440px;background:linear-gradient(180deg,var(--panel),var(--bg2));padding:22px 20px;overflow-y:auto;height:calc(100vh - 47px);border-right:1px solid var(--rail2)}
.left h1{font-size:18px;font-weight:700;margin-bottom:5px;color:var(--t1);letter-spacing:.1px}
.left .sub{font-size:11px;color:var(--t3);margin-bottom:18px}
.col-l{width:348px;background:linear-gradient(180deg,var(--panel),var(--bg2));padding:22px 18px;overflow-y:auto;height:calc(100vh - 47px);border-right:1px solid var(--rail2)}
.col-l h1{font-size:18px;font-weight:700;margin-bottom:5px;color:var(--t1);letter-spacing:.1px}
.col-l .sub{font-size:11px;color:var(--t3);margin-bottom:14px}
.col-c{flex:1;display:flex;align-items:center;justify-content:center;padding:30px;position:relative;background:radial-gradient(circle at center,rgba(46,138,88,.18),transparent 44%),linear-gradient(135deg,#111612,#1E2A21 52%,#111612)}
.col-r{width:244px;background:linear-gradient(180deg,var(--panel),var(--bg2));padding:16px;overflow-y:auto;height:calc(100vh - 47px);border-left:1px solid var(--rail2)}
.col-c .preview{max-height:92vh;border-radius:8px;box-shadow:0 18px 44px rgba(0,0,0,.58),0 0 0 6px rgba(83,57,31,.55),0 0 0 7px rgba(199,164,91,.22);cursor:zoom-in}
.field{margin-bottom:15px}
.field label{display:block;font-size:11px;color:var(--t2);margin-bottom:7px;font-weight:600;letter-spacing:.15px}
.field input,.field textarea,.field select{width:100%;background:var(--field);border:1px solid var(--border2);color:var(--t1);padding:9px 11px;border-radius:var(--radius);font-size:12px;outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
.field input:hover,.field textarea:hover,.field select:hover{border-color:var(--border3);background:#181818}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--accent-soft);background:#111}
.field textarea.prompt-generated{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--accent-soft)}
.field input.fit-warn,.field textarea.fit-warn{border-color:var(--warning);box-shadow:0 0 0 1px rgba(213,140,20,.55),0 0 0 4px rgba(213,140,20,.12)}
.field input.fit-error,.field textarea.fit-error{border-color:var(--danger);box-shadow:0 0 0 1px rgba(227,72,80,.55),0 0 0 4px rgba(227,72,80,.14);background:rgba(227,72,80,.06)}
.field textarea{resize:vertical;min-height:72px;line-height:1.5}
.row{display:flex;gap:10px}.row .field{flex:1}
.colors{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.color-opt{height:34px;border-radius:var(--radius);cursor:pointer;border:1px solid var(--border2);transition:border-color .15s,box-shadow .15s,transform .15s}
.color-opt:hover{border-color:var(--border3);transform:translateY(-1px)}
.color-opt.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--accent-soft)}
input[type=color]{width:50px;height:50px;border:2px solid var(--border2);border-radius:50%;cursor:pointer;background:none;padding:0;overflow:hidden;transition:all .15s;box-shadow:0 0 0 3px var(--panel),0 6px 16px rgba(0,0,0,.28)}
input[type=color]:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--accent-soft),0 10px 22px rgba(0,0,0,.34);transform:scale(1.04)}
input[type=color]::-webkit-color-swatch{border:none;border-radius:50%}
input[type=color]::-webkit-color-swatch-wrapper{padding:0;border-radius:50%}
.type-panel{margin-bottom:12px}.type-panel .sect{cursor:pointer;list-style:none}.type-colors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}.type-color{font-size:10px;color:var(--t2)}.type-color input[type=color]{display:block;width:38px;height:38px;margin-top:6px}.type-color input:disabled{opacity:.35;cursor:not-allowed}.inline-check{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--t2);cursor:pointer;margin:-2px 0 8px}.inline-check input{width:auto}
button{padding:10px 12px;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:var(--radius);font-size:12px;font-weight:700;cursor:pointer;width:100%;transition:background .15s,border-color .15s,box-shadow .15s,transform .12s;box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 5px 12px rgba(0,0,0,.22)}
button:hover{background:var(--accent-h);border-color:var(--accent-h);transform:translateY(-1px)}
button:active{transform:translateY(0);box-shadow:none}
button:focus-visible{outline:0;box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--accent-soft)}
button.sec{background:transparent;color:var(--t1);border:1px solid var(--border2);margin-top:8px;box-shadow:none}
button.sec:hover{background:rgba(255,255,255,.055);border-color:var(--border3)}
.action-status{min-height:18px;margin-top:7px;font-size:11px;line-height:1.45;color:var(--t2)}
.action-status.success{color:var(--success)}.action-status.error{color:var(--danger)}
.copy-fit-hint{margin:-6px 0 13px;padding:11px;border:1px solid var(--border2);border-left:3px solid var(--accent);border-radius:var(--radius);background:rgba(255,255,255,.035);font-size:10px;line-height:1.45;color:var(--t2)}
.copy-fit-hint.ok{border-left-color:var(--success)}.copy-fit-hint.warn{border-left-color:var(--warning)}.copy-fit-hint.error{border-left-color:var(--danger);background:rgba(227,72,80,.075)}
.copy-fit-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.copy-fit-title{font-size:11px;font-weight:700;color:var(--t1)}.copy-fit-badge{flex:0 0 auto;padding:2px 8px;border-radius:999px;background:rgba(45,157,120,.16);color:#55D6A9;font-weight:700}.copy-fit-hint.error .copy-fit-badge{background:rgba(227,72,80,.14);color:#FF9CA3}.copy-fit-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.copy-fit-chip{padding:5px 7px;border:1px solid var(--border);border-radius:5px;background:rgba(0,0,0,.2)}.copy-fit-chip.over{border-color:var(--danger);color:#FF9CA3}.copy-fit-detail{margin-top:7px;color:var(--t3)}
.bi-fit{font-size:10px;line-height:1.45;margin-top:-2px;margin-bottom:6px;color:var(--t3)}.bi-fit.error{color:#FF9CA3}.bi-fit.ok{color:#55D6A9}.bi-item.overfit{border-color:var(--danger)!important;box-shadow:0 0 0 1px rgba(227,72,80,.35)}
.cloud-panel{margin-bottom:18px;padding:14px;background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 1px 0 rgba(255,255,255,.035) inset}
.cloud-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cloud-actions button{margin:0}
.cloud-summary{min-width:260px;text-align:left;line-height:1.8;color:var(--t2)}
.hint{color:var(--t3);font-size:12px;text-align:center;line-height:1.7}
.sect{font-size:10px;color:var(--t2);font-weight:700;text-transform:uppercase;letter-spacing:.75px;margin:16px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.render-badge{position:absolute;top:18px;left:18px;background:rgba(20,115,230,.94);color:#fff;font-size:10px;padding:5px 11px;border-radius:999px;display:none;z-index:5;font-weight:700;box-shadow:0 8px 22px rgba(20,115,230,.22)}
.hist-h{font-size:10px;color:var(--t2);margin-bottom:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.hist-clear{float:right;width:auto;padding:0;background:none;border:0;color:var(--t3);font-size:10px;font-weight:500}
.hist-clear:hover{background:none;border:0;color:var(--t1)}
.hist-item{width:100%;margin-bottom:10px;border-radius:8px;overflow:hidden;border:1px solid var(--border);cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s;background:var(--panel2)}
.hist-item:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.hist-item img{width:100%;display:block}
.hist-empty{font-size:11px;color:var(--t3);text-align:center;padding:20px 0;line-height:1.6}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:11px}
th,td{padding:7px 5px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--t2);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.55px}
td input,td select,td textarea{width:100%;background:var(--field);border:1px solid var(--border2);color:var(--t1);padding:6px 7px;border-radius:5px;font-size:11px;outline:none}
td input:focus,td select:focus,td textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
td textarea{min-height:48px;resize:vertical}
.acc-tbl{font-size:12px;margin-top:12px}.acc-tbl th{color:var(--t2);padding:7px 5px}
.batch-grid{flex:1;display:flex;flex-wrap:wrap;gap:16px;overflow-y:auto;padding:28px;align-content:flex-start}
.batch-item{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--border);transition:border-color .15s,transform .15s,box-shadow .15s;background:var(--panel2)}
.batch-item:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.32)}
.batch-item img{height:320px;display:block;cursor:zoom-in}
.batch-item .dl{position:absolute;bottom:8px;right:8px;background:rgba(20,20,20,.82);backdrop-filter:blur(10px);color:#fff;padding:5px 9px;border-radius:999px;font-size:10px;text-decoration:none;border:1px solid rgba(255,255,255,.18);font-weight:700}
.template-mix{margin:-2px 0 14px;padding:12px;background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius);max-height:310px;overflow:auto}
.template-mix>label{display:block;font-size:11px;color:var(--t2);margin-bottom:8px;font-weight:700}
.template-mix-row{display:grid;grid-template-columns:minmax(0,1fr) 76px;align-items:center;gap:8px;margin-bottom:6px}
.template-mix-row span{font-size:11px;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.template-mix-row input{width:100%;padding:6px 7px!important;text-align:right}
.template-mix-summary{margin-top:9px;padding-top:8px;border-top:1px solid var(--border);font-size:10px;color:var(--t3)}
[hidden]{display:none!important}
.del{color:var(--danger);cursor:pointer;font-size:14px;padding:2px}
.del:hover{color:#FF9CA3}
.statusbar{position:fixed;bottom:0;left:0;right:0;height:26px;background:rgba(32,32,32,.96);backdrop-filter:blur(18px);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 18px;font-size:10px;color:var(--t3);z-index:40;gap:18px}
.statusbar .item{display:flex;align-items:center;gap:5px}
.statusbar .dot{width:6px;height:6px;border-radius:50%;background:var(--t3)}
.statusbar .dot.on{background:var(--success);box-shadow:0 0 0 3px rgba(45,157,120,.14)}
.col-l,.col-r,.left{height:calc(100vh - 71px)!important}
.lightbox{position:fixed;inset:0;background:rgba(15,15,15,.97);display:none;align-items:center;justify-content:center;z-index:999;cursor:zoom-out}
.lightbox.show{display:flex}
.lightbox img{max-width:94vw;max-height:94vh;border-radius:10px;box-shadow:0 22px 70px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.09)}
.lightbox .close{position:fixed;top:16px;right:24px;color:#fff;font-size:36px;cursor:pointer;z-index:1000;opacity:.6}
.lightbox .close:hover{opacity:1}
#promptView,#bPrompt{background:var(--field)!important;color:#D8E6DC!important;border-color:var(--border2)!important;font-family:"Cascadia Mono","Consolas",monospace!important;border-radius:var(--radius)!important}
#bList .bi-item{background:var(--panel2)!important;border:1px solid var(--border2)!important;border-radius:8px!important;padding:12px!important;margin-bottom:12px!important;box-shadow:0 1px 0 rgba(255,255,255,.035) inset}
#bList .bi-item>div:first-child{font-weight:700!important;color:var(--accent)!important;margin-bottom:7px!important;letter-spacing:.2px}
#bList .bi-item input,#bList .bi-item textarea{background:var(--field)!important;border:1px solid var(--border2)!important;border-radius:var(--radius)!important;color:var(--t1)!important;padding:8px 9px!important}
#bList .bi-item input:focus,#bList .bi-item textarea:focus{border-color:var(--accent)!important;box-shadow:0 0 0 3px var(--accent-soft)!important;outline:0!important}
#libList>div:not(.hist-empty){background:var(--panel2)!important;border:1px solid var(--border2)!important;border-radius:8px!important;margin-bottom:8px!important;padding:10px!important;box-shadow:0 1px 0 rgba(255,255,255,.035) inset}
#libList>div:not(.hist-empty):hover{border-color:var(--accent)!important;transform:translateY(-1px)}
#batchGrid>div:first-child:not(.batch-item){background:var(--panel2)!important;border:1px solid var(--border)!important;border-radius:999px!important;height:30px!important;box-shadow:0 1px 0 rgba(255,255,255,.035) inset}
#batchGrid>div:first-child:not(.batch-item)>div:first-child{background:linear-gradient(90deg,var(--accent),var(--brass))!important}
</style></head><body>
<div class="tabs" role="tablist" aria-label="功能页面">
  <div class="tab active" id="tab0" role="tab" aria-controls="p0" aria-selected="true" tabindex="0" data-tab-index="0" title="单条图文实时预览编辑">单条生成</div>
  <div class="tab" id="tab1" role="tab" aria-controls="p1" aria-selected="false" tabindex="-1" data-tab-index="1" title="一次生成N条差异化文案批量渲染">批量生成</div>
  <div class="tab" id="tab2" role="tab" aria-controls="p2" aria-selected="false" tabindex="-1" data-tab-index="2" title="云服务与存储路径配置">设置</div>
</div>

<div class="page active" id="p0" role="tabpanel" aria-labelledby="tab0">
  <div class="col-l">
    <h1>单条生成</h1>
    <div class="sect">模板与配色</div>
    <div class="field"><label>模板风格</label><select id="tpl"></select></div>
    <div class="field"><label>题材预设（自动填充）</label><select id="preset"></select></div>
    <div class="field"><label>配色方案</label>
    <div style="display:flex;gap:12px;align-items:center">
      <input type="color" id="color1" value="#FF8A5C" title="主色：点击拾色器选择渐变起始色">
      <div style="flex:1;height:44px;border-radius:22px;background:linear-gradient(90deg,#FF8A5C,#FF5E62);border:1px solid var(--border);transition:all .15s" id="gradPreview" title="渐变预览：实时显示主辅色渐变效果"></div>
      <input type="color" id="color2" value="#FF5E62" title="辅色：点击拾色器选择渐变结束色">
    </div></div>
    <details class="type-panel">
      <summary class="sect">字体样式</summary>
      <div class="field"><label>字体</label><select id="fontFamily"><option value="theme" selected>跟随模板</option><option value="sans">黑体 / 无衬线</option><option value="serif">宋体 / 衬线</option><option value="system">系统字体</option><option value="mono">等宽风格</option></select></div>
      <div class="row"><div class="field"><label>标题粗细</label><select id="titleWeight"><option value="0" selected>跟随模板</option><option value="400">常规</option><option value="600">半粗</option><option value="700">加粗</option><option value="900">特粗</option></select></div><div class="field"><label>正文粗细</label><select id="bodyWeight"><option value="0" selected>跟随模板</option><option value="300">细</option><option value="400">常规</option><option value="500">中等</option><option value="700">加粗</option></select></div></div>
      <label class="inline-check"><input type="checkbox" id="customTextColors"> 启用文字颜色覆盖</label>
      <div class="type-colors"><label class="type-color">标题<input type="color" id="titleColor" value="#111111" disabled></label><label class="type-color">正文<input type="color" id="bodyColor" value="#333333" disabled></label><label class="type-color">话题<input type="color" id="tagColor" value="#2680EB" disabled></label></div>
    </details>
    <div class="sect">内容</div>
    <div class="row">
      <div class="field"><label>序号</label><input id="num" value="01"></div>
      <div class="field"><label>标签(英文)</label><input id="tag" value="BILLIARDS"></div>
    </div>
    <div class="field"><label>标题</label><input id="title"></div>
    <div class="field"><label>正文（换行用回车）</label><textarea id="bodytxt"></textarea></div><div id="singleFitHint" class="copy-fit-hint" aria-live="polite"></div>
    <div class="field"><label>话题标签</label><input id="tags"></div>
    <div id="singleTagsFitHint" class="copy-fit-hint" aria-live="polite"></div>
    <details>
    <summary class="sect" style="cursor:pointer;list-style:none">文案助手</summary>
    <div class="row" style="margin-bottom:8px">
      <div class="field" style="margin:0"><label>题材</label><select id="gTheme"><option>找搭子</option><option>球房测评</option><option>新手避坑</option><option>约球吐槽</option><option>球杆科普</option><option>技术段位</option><option>球友日常</option><option>赛事战报</option></select></div>
      <div class="field" style="margin:0"><label>档位</label><select id="gLevel"><option>1档</option><option selected>2档</option><option>3档</option></select></div>
    </div>
    <div class="row" style="margin-bottom:8px">
      <div class="field" style="margin:0"><label>区域</label><input id="gRegion" value="斗门"></div>
      <div class="field" style="margin:0"><label>性格</label><select id="gPersona"><option selected>热情约球型</option><option>技术宅</option><option>吐槽役</option><option>新手求带</option><option>老炮带人</option></select></div>
    </div>
    <div class="field"><label>语气</label><select id="gTone"></select></div>
    <label style="display:flex;align-items:center;gap:7px;font-size:11px;color:var(--t2);cursor:pointer;margin-bottom:10px"><input type="checkbox" id="useEmoji" style="width:auto;cursor:pointer"> 允许表情符号</label>
    <button id="generatePromptButton" type="button" class="sec" style="margin-bottom:8px" title="根据上方人设整理创作方向">整理创作方向</button>
    <div class="field"><label>创作方向（可编辑）</label><textarea id="promptView" style="background:var(--bg);color:#7c9;font-family:monospace;font-size:11px;min-height:80px"></textarea></div>
    <button id="singleGenerateCopyButton" type="button" title="按当前创作方向生成文案">生成文案</button>
    <div id="singleAiStatus" class="action-status" aria-live="polite"></div>
    </details>
  </div>
  <div class="col-c">
    <div class="render-badge" id="renderBadge">渲染中</div>
    <div class="hint" id="hint0">改左侧参数 · 中间实时预览</div>
    <img class="preview" id="preview0" style="display:none" alt="当前图文预览">
  </div>
  <div class="col-r">
    <div class="hist-h">渲染历史 <button id="clearHistoryButton" type="button" class="hist-clear">清空</button></div>
    <div id="histList"><div class="hist-empty">暂无历史<br>改参数自动预览</div></div>
    <div class="hist-h" style="margin-top:18px">文案库</div>
    <div id="libList"><div class="hist-empty">起稿后的文案<br>存这里可复用</div></div>

<div class="lightbox" id="lightbox"><span class="close" id="lightboxClose" role="button" aria-label="关闭预览" tabindex="0">&times;</span><img id="lbImg" alt="放大预览"></div>
<script>
const tauriInvoke=window.__TAURI__?.core?.invoke;
const tauriListen=window.__TAURI__?.event?.listen;
const nativeReady=typeof tauriInvoke==="function";
const nativeInvoke=nativeReady?tauriInvoke.bind(window.__TAURI__.core):async()=>{throw new Error("桌面服务不可用")};
const nativeListen=typeof tauriListen==="function"?tauriListen.bind(window.__TAURI__.event):null;
const SC=[{n:"暖橙",g1:"#FF8A5C",g2:"#FF5E62",a:"#FF5E62"},{n:"薄荷",g1:"#43E97B",g2:"#38F9D7",a:"#0FB9B1"},{n:"天蓝",g1:"#4FACFE",g2:"#00C6FB",a:"#1E90FF"},{n:"紫粉",g1:"#A18CD1",g2:"#FBC2EB",a:"#8E44AD"},{n:"深蓝",g1:"#2C3E50",g2:"#4CA1AF",a:"#3A6E8F"}];
let cur=SC[0],presets=[],tpls=[],templateMixCounts={},lastFile="",histArr=[],renderTimer=null,renderCnt=0,renderBusy=false,renderQueued=false,cloudLoggedIn=false;
function showTab(i){document.querySelectorAll('.tab').forEach((tab,index)=>{const active=index===i;tab.classList.toggle('active',active);tab.setAttribute('aria-selected',String(active));tab.tabIndex=active?0:-1});document.querySelectorAll('.page').forEach((page,index)=>page.classList.toggle('active',index===i))}
function openLightbox(src){document.getElementById("lbImg").src=src;document.getElementById("lightbox").classList.add("show")}
function closeLightbox(){document.getElementById("lightbox").classList.remove("show")}

// 配色
function updateGrad(){document.getElementById("gradPreview").style.background=`linear-gradient(90deg,${document.getElementById("color1").value},${document.getElementById("color2").value})`}
function typeId(prefix,name){return prefix?prefix+name.charAt(0).toUpperCase()+name.slice(1):name}
function syncTextColorInputs(prefix=""){const enabled=document.getElementById(typeId(prefix,"customTextColors"))?.checked===true;["titleColor","bodyColor","tagColor"].forEach(name=>{const input=document.getElementById(typeId(prefix,name));if(input)input.disabled=!enabled})}
function typographyPayload(prefix=""){const custom=document.getElementById(typeId(prefix,"customTextColors"))?.checked===true;return{fontFamily:document.getElementById(typeId(prefix,"fontFamily"))?.value||"theme",titleWeight:parseInt(document.getElementById(typeId(prefix,"titleWeight"))?.value)||0,bodyWeight:parseInt(document.getElementById(typeId(prefix,"bodyWeight"))?.value)||0,titleColor:custom?document.getElementById(typeId(prefix,"titleColor"))?.value||"":"",bodyColor:custom?document.getElementById(typeId(prefix,"bodyColor"))?.value||"":"",tagColor:custom?document.getElementById(typeId(prefix,"tagColor"))?.value||"":""}}
if(nativeReady){
  nativeInvoke("get_templates").then(d=>{tpls=d;["tpl","bTpl"].forEach(id=>{const sel=document.getElementById(id);if(sel)d.forEach(t=>{const o=document.createElement("option");o.value=t.id;o.textContent=t.name;sel.appendChild(o)})});renderTemplateMix();updateSingleFitHint();updateBatchFitHint()}).catch(e=>alert("模板读取失败："+e));
  nativeInvoke("get_presets").then(d=>{presets=d;const sel=document.getElementById("preset");d.forEach((p,i)=>{const o=document.createElement("option");o.value=i;o.textContent=p.name;sel.appendChild(o)});loadPreset()}).catch(e=>alert("预设读取失败："+e));
}
function loadPreset(){const p=presets[document.getElementById("preset").value];if(!p)return;document.getElementById("num").value=String(parseInt(document.getElementById("preset").value)+1).padStart(2,"0");document.getElementById("tag").value=p.tag;document.getElementById("title").value=p.title;document.getElementById("bodytxt").value=p.body;document.getElementById("tags").value=p.tags;const i=SC.findIndex(s=>s.a===p.accent);if(i>=0){cur=SC[i];document.getElementById("color1").value=SC[i].g1;document.getElementById("color2").value=SC[i].g2;updateGrad()}scheduleRender()}

// 实时预览
function scheduleRender(){updateSingleFitHint();clearTimeout(renderTimer);renderTimer=setTimeout(autoRender,600)}
async function autoRender(){if(renderBusy){renderQueued=true;return}const b={template:document.getElementById("tpl").value,num:document.getElementById("num").value,tag:document.getElementById("tag").value,title:document.getElementById("title").value,body:document.getElementById("bodytxt").value,tags:document.getElementById("tags").value,glow1:cur.g1,glow2:cur.g2,accent:cur.a,...typographyPayload()};if(!b.title)return;renderBusy=true;const badge=document.getElementById("renderBadge"),hint=document.getElementById("hint0");badge.style.display="block";hint.style.display="none";try{const result=await nativeInvoke("render_preview",{request:b});document.getElementById("preview0").src="data:image/png;base64,"+result.imageBase64;document.getElementById("preview0").style.display="block";renderCnt++;document.getElementById("statCnt").textContent=renderCnt;document.getElementById("statTpl").textContent=document.getElementById("tpl").selectedOptions[0]?.text||"-"}catch(e){hint.textContent="渲染失败："+String(e);hint.style.display="block"}finally{renderBusy=false;badge.style.display="none";if(renderQueued){renderQueued=false;scheduleRender()}}}
async function loadHistory(){const h=document.getElementById("histList");if(!nativeReady){h.innerHTML="<div class='hist-empty'>历史仅在桌面应用中可用</div>";return}try{histArr=await nativeInvoke("get_render_history");h.innerHTML="";let shown=0;for(const item of histArr){if(shown>=20)break;try{const img=await nativeInvoke("read_history_image",{historyId:item.id});const src="data:image/png;base64,"+img,d=document.createElement("div"),im=document.createElement("img");d.className="hist-item";d.title=item.fileName;im.src=src;d.appendChild(im);d.addEventListener("click",()=>openLightbox(src));h.appendChild(d);shown++}catch(_){}}if(!shown)h.innerHTML="<div class='hist-empty'>暂无已保存图片</div>"}catch(e){h.innerHTML="<div class='hist-empty'>历史读取失败</div>"}}
async function clearHist(){if(!nativeReady||!confirm("清空历史记录？已保存的图片文件不会删除。"))return;try{await nativeInvoke("clear_render_history");histArr=[];await loadHistory()}catch(e){alert("清空历史失败："+e)}}
async function saveRender(btn){const b={template:document.getElementById("tpl").value,num:document.getElementById("num").value,tag:document.getElementById("tag").value,title:document.getElementById("title").value,body:document.getElementById("bodytxt").value,tags:document.getElementById("tags").value,glow1:cur.g1,glow2:cur.g2,accent:cur.a,...typographyPayload()};btn.textContent="保存中...";btn.disabled=true;try{const result=await nativeInvoke("render_save",{request:b,outputDir:null});lastFile=result.fileName;btn.textContent="已保存";await loadHistory();setTimeout(()=>{btn.textContent="保存到文件夹"},1500)}catch(e){alert("保存失败："+String(e))}finally{btn.disabled=false;if(btn.textContent==="保存中...")btn.textContent="保存到文件夹"}}

// 文案助手
const PERSONA_GUIDES={
  "热情约球型":"外向主动、真诚招呼同城球友。开头用具体组局场景或直接邀约，正文强调好相处和一起玩的氛围，结尾主动发起约球；不要装高手。",
  "技术宅":"关注杆法、走位、发力或器材等可验证细节。围绕一个具体技术点表达观察和判断，可用少量专业词但要说清楚；结尾邀请交流打法，不要泛泛喊约球。",
  "吐槽役":"用第一人称吐槽真实球局里的尴尬和反差，短句有节奏，略犀利但不攻击球友或球房；结尾用自嘲或反问邀人一起玩。",
  "新手求带":"明确是仍在学习的萌新，从困惑、翻车或小进步切入，提出一个具体问题并真诚求带；不冒充高手，不输出权威教学。",
  "老炮带人":"表现有经验、稳当且愿意带新人，用实战经验给一条具体判断或建议，语气平等不说教；结尾表达可以带局或带练。"
};
const LEVEL_GUIDES={
  "1档":"球技处于入门阶段，可以写失误、困惑和求教，不要使用高手口吻。",
  "2档":"已有基本功和实战体验，可以表达个人判断，但不要吹嘘水平。",
  "3档":"经验较丰富，可以谈策略和技术细节，但保持克制，不端着教育别人。"
};
const TONE_GUIDES={
  "口语化":"像发给本地球友的消息，多用自然短句，不写宣传稿。",
  "略专业":"表达清楚、术语准确，每次只讲一个重点，普通球友也能看懂。",
  "搞笑自嘲":"用具体反差制造笑点，主要调侃自己，不刻薄别人。",
  "热血鼓励":"语气积极、有冲劲，强调进步、上场和再来一局，但不要喊口号过猛。",
  "克制高级":"短句克制、有质感，少用感叹号，表达像高端球房笔记，不堆华丽词。",
  "朋友聊天":"像熟人聊天一样自然，带一点生活细节和随口感，别写成正式广告。",
  "老板推荐":"像球房老板真诚推荐局和场地，强调体验、氛围和适合谁来玩，不夸张承诺。",
  "新手求助":"承认还在学习，用问题和小困惑切入，语气真诚，适合引发球友回复。",
  "老炮点评":"有经验但不端着，给一条实战判断或观察，语气稳、平等、不说教。",
  "技术分析":"围绕一个技术点讲清楚因果，如走位、发力、杆法或防守，普通球友也能读懂。",
  "轻松吐槽":"吐槽真实球局里的小尴尬，节奏轻快，主要吐槽自己或场景，不攻击别人。",
  "反差幽默":"用预期和结果的反差制造笑点，短句有梗，但不要尬段子或网络烂梗堆叠。",
  "温柔陪练":"语气耐心、鼓励，适合带新手或约练，强调不催、不嫌弃、慢慢打。",
  "赛事解说":"像简短战报或现场解说，有比分感、回合感和关键转折，别写长篇新闻稿。",
  "探店测评":"从环境、台况、价格、服务或人群切入，评价具体，优缺点都可以轻轻提。",
  "避坑提醒":"直接给一个容易踩坑的点和解决建议，语气友好，不制造焦虑。",
  "挑战宣言":"带一点挑战感和目标感，适合约战、练球打卡，语气坚定但不狂。",
  "沉浸故事":"用第一人称小故事展开，有时间、地点或动作细节，结尾自然落到约球。",
  "干货清单":"用清单或要点表达，信息密度高但短，适合技巧、装备、球房选择。",
  "犀利短评":"观点鲜明、句子短，有一点锋芒，但不人身攻击、不阴阳怪气。",
  "悬念开场":"开头设置一个具体悬念或反常识观察，正文快速揭示，不故弄玄虚。",
  "社群召集":"目标是招呼同城球友进群，语气明确友好，强调一起玩和群内氛围。",
  "深夜碎碎念":"像晚上打完球后的随笔，有情绪和复盘感，语气松弛，不伤感过度。",
  "高级冷淡":"冷静、简短、有距离感，像极简海报文案，少形容词，保留一点态度。",
  "俏皮可爱":"轻快俏皮，可有少量语气词和表情符号，但不要幼稚或过度卖萌。",
  "硬核训练":"强调训练计划、重复练习和结果反馈，语气认真，适合技术提升内容。",
  "佛系随缘":"轻松、不卷，强调输赢随缘、开心打球，语气柔和但不要空泛。",
  "本地烟火气":"带本地生活感和同城熟人感，可提区域、下班、周末、附近球房等场景。",
  "复盘总结":"像打完一局后的简短复盘，有收获、有问题、有下一步，不写流水账。",
  "轻奢种草":"语气精致、推荐感强，突出环境、体验和质感，但避免虚假高端和过度营销。"
};
const DEFAULT_TONE="口语化";
const RANDOM_TONE_VALUE="__random_tone__";
const AI_PROMPT_MAX_CHARS=20000;
const TONE_OPTIONS=Object.keys(TONE_GUIDES);
function populateToneSelects(){["gTone","bTone"].forEach(id=>{const sel=document.getElementById(id);if(!sel||sel.dataset.ready==="1")return;sel.innerHTML="";const random=document.createElement("option");random.value=RANDOM_TONE_VALUE;random.textContent="随机语气（起稿时抽取）";sel.appendChild(random);TONE_OPTIONS.forEach(tone=>{const option=document.createElement("option");option.value=tone;option.textContent=tone;sel.appendChild(option)});sel.value=DEFAULT_TONE;sel.dataset.ready="1"})}

async function addLib(title,body,tags){try{await nativeInvoke("save_copy_library",{item:{title,body,tags}});await renderLib()}catch(e){alert("文案保存失败："+e)}}
async function renderLib(){let arr=[];try{arr=await nativeInvoke("get_copy_library")}catch(e){document.getElementById("libList").innerHTML="<div class='hist-empty'>文案库读取失败</div>";return}const el=document.getElementById("libList");if(!arr.length){el.innerHTML="<div class='hist-empty'>起稿后的文案<br>存这里可复用</div>";return}el.innerHTML="";arr.forEach(it=>{const d=document.createElement("div"),title=document.createElement("div"),body=document.createElement("div");d.style.cssText="padding:8px;border:1px solid var(--border);border-radius:4px;margin-bottom:5px;cursor:pointer;font-size:11px;transition:all .15s";title.style.cssText="color:var(--t1);margin-bottom:3px;font-weight:500";body.style.cssText="color:var(--t3);font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis";title.textContent=it.title;body.textContent=it.body;d.appendChild(title);d.appendChild(body);d.addEventListener("mouseenter",()=>d.style.borderColor="var(--accent)");d.addEventListener("mouseleave",()=>d.style.borderColor="var(--border)");d.addEventListener("click",()=>{document.getElementById("title").value=it.title;document.getElementById("bodytxt").value=it.body;document.getElementById("tags").value=it.tags;scheduleRender()});el.appendChild(d)})}
function cloudTime(value){if(!value)return "尚未同步";try{return "上次同步："+new Date(value*1000).toLocaleString()}catch(_){return "尚未同步"}}
function applyCloudStatus(status){cloudLoggedIn=status.loggedIn===true;const dot=document.getElementById("apiDot"),stat=document.getElementById("apiStat"),cloudStatus=document.getElementById("cloudStatus"),title=document.getElementById("cloudSummaryTitle"),detail=document.getElementById("cloudSummaryDetail"),sync=document.getElementById("cloudSummarySync"),logout=document.getElementById("cloudLogoutButton"),upload=document.getElementById("cloudUploadButton"),download=document.getElementById("cloudDownloadButton");dot.classList.toggle("on",cloudLoggedIn);stat.textContent=cloudLoggedIn?"云服务已登录":"云服务未登录";document.getElementById("cloudServerUrl").value=status.serverUrl||"";if(status.email&&!document.getElementById("cloudEmail").value)document.getElementById("cloudEmail").value=status.email;title.textContent=cloudLoggedIn?(status.email||"已登录云服务"):"未登录云服务";detail.textContent=status.serverConfigured?(status.serverUrl+(cloudLoggedIn?"":"，等待登录")):"请配置服务器地址";sync.textContent=cloudTime(status.lastSyncAt);logout.disabled=!cloudLoggedIn;upload.disabled=!cloudLoggedIn;download.disabled=!cloudLoggedIn;if(cloudStatus&&!cloudStatus.textContent)cloudStatus.textContent=cloudLoggedIn?"云端功能可用":""}
async function loadCloudStatus(){try{const status=await nativeInvoke("get_cloud_status");applyCloudStatus(status)}catch(e){document.getElementById("cloudStatus").textContent="云服务状态读取失败："+String(e)}}
async function saveCloudServer(showMessage=true){const value=document.getElementById("cloudServerUrl").value.trim();if(!value){setActionStatus("cloudStatus","请填写服务器地址","error");return false}try{const status=await nativeInvoke("set_cloud_server_url",{serverUrl:value});applyCloudStatus(status);if(showMessage)setActionStatus("cloudStatus","服务器地址已保存","success");return true}catch(e){setActionStatus("cloudStatus",String(e),"error");return false}}
async function testCloud(){const button=document.getElementById("testCloudButton");button.disabled=true;button.textContent="测试中...";try{if(!await saveCloudServer(false))return;const message=await nativeInvoke("test_cloud_connection");setActionStatus("cloudStatus",message,"success")}catch(e){setActionStatus("cloudStatus",String(e),"error")}finally{button.disabled=false;button.textContent="测试连接"}}
async function cloudAuth(mode){const email=document.getElementById("cloudEmail").value.trim(),password=document.getElementById("cloudPassword").value;const button=document.getElementById(mode==="login"?"cloudLoginButton":"cloudRegisterButton");if(!email||!password){setActionStatus("cloudStatus","请输入邮箱和密码","error");return}button.disabled=true;button.textContent=mode==="login"?"登录中...":"注册中...";try{if(!await saveCloudServer(false))return;const status=await nativeInvoke(mode==="login"?"cloud_login":"cloud_register",{email,password});applyCloudStatus(status);document.getElementById("cloudPassword").value="";setActionStatus("cloudStatus",mode==="login"?"登录成功，请选择同步方向":"注册成功，请选择同步方向","success")}catch(e){setActionStatus("cloudStatus",String(e),"error")}finally{button.disabled=false;button.textContent=mode==="login"?"登录":"注册"}}
async function cloudLogout(){const button=document.getElementById("cloudLogoutButton");button.disabled=true;try{const status=await nativeInvoke("cloud_logout");applyCloudStatus(status);setActionStatus("cloudStatus","已退出登录","success")}catch(e){setActionStatus("cloudStatus",String(e),"error")}finally{button.disabled=!cloudLoggedIn}}
function collectAccounts(){return[...document.querySelectorAll("#accountRows tr")].map(row=>{const data={cloudId:row.dataset.cloudId||null,persona:row.dataset.persona||"热情约球型",tone:row.dataset.tone||"口语化",status:row.dataset.status||"养号中"};row.querySelectorAll("input").forEach(input=>data[input.dataset.key]=input.value.trim());return data}).filter(account=>account.name)}
async function cloudUpload(){if(!cloudLoggedIn){setActionStatus("cloudSyncStatus","请先登录云服务","error");return}if(!confirm("上传本机账号和文案库，覆盖云端同类数据？"))return;try{await nativeInvoke("set_accounts",{accounts:collectAccounts()});const result=await nativeInvoke("cloud_sync_upload");setActionStatus("cloudSyncStatus",`已上传 ${result.accounts} 个账号、${result.copyItems} 条文案`,"success");await loadCloudStatus()}catch(e){setActionStatus("cloudSyncStatus","上传失败："+String(e),"error")}}
async function cloudDownload(){if(!cloudLoggedIn){setActionStatus("cloudSyncStatus","请先登录云服务","error");return}if(!confirm("下载云端数据会替换本机账号和文案库，图片历史与输出目录不受影响。继续？"))return;try{const result=await nativeInvoke("cloud_sync_download");setActionStatus("cloudSyncStatus",`已下载 ${result.accounts} 个账号、${result.copyItems} 条文案`,"success");await Promise.all([loadSettings(),loadAccounts(),renderLib(),loadCloudStatus()])}catch(e){setActionStatus("cloudSyncStatus","下载失败："+String(e),"error")}}
async function saveDir(){const outputDir=document.getElementById("outDir").value.trim();if(!outputDir){alert("请输入路径");return}try{await nativeInvoke("set_settings",{settings:{output_dir:outputDir}});await loadSettings();alert("路径已保存")}catch(e){alert("目录不可用："+e)}}
async function openFolder(){try{await nativeInvoke("open_output_folder",{path:null})}catch(e){alert("打开目录失败："+e)}}
async function loadSettings(){try{const s=await nativeInvoke("get_settings");document.getElementById("statDir").textContent=(s.output_dir||"output").split(/[\\/]/).pop();if(s.output_dir)document.getElementById("outDir").value=s.output_dir}catch(e){setActionStatus("cloudStatus","设置读取失败："+String(e),"error")}}
function accountRow(account={name:"",region:"斗门",level:"2档",persona:"热情约球型",tone:"口语化",status:"养号中"}){const tr=document.createElement("tr");for(const key of ["name","region","level"]){const td=document.createElement("td"),input=document.createElement("input");input.dataset.key=key;input.value=account[key]||"";td.appendChild(input);tr.appendChild(td)}const td=document.createElement("td"),del=document.createElement("span");del.className="del";del.textContent="×";del.title="删除账号";del.addEventListener("click",()=>tr.remove());td.appendChild(del);tr.appendChild(td);tr.dataset.cloudId=account.cloudId||"";tr.dataset.persona=account.persona||"";tr.dataset.tone=account.tone||"";tr.dataset.status=account.status||"";return tr}
function addAccount(){document.getElementById("accountRows").appendChild(accountRow())}
async function loadAccounts(){try{const accounts=await nativeInvoke("get_accounts"),rows=document.getElementById("accountRows");rows.innerHTML="";accounts.forEach(account=>rows.appendChild(accountRow(account)))}catch(e){document.getElementById("accountRows").innerHTML="";setActionStatus("cloudStatus","账号配置读取失败："+String(e),"error")}}
async function saveAccounts(){try{await nativeInvoke("set_accounts",{accounts:collectAccounts()});alert("账号配置已保存")}catch(e){alert("账号配置保存失败："+e)}}
async function migrateLegacy(){try{await nativeInvoke("migrate_legacy");const parsed=JSON.parse(localStorage.getItem("lib")||"[]"),items=Array.isArray(parsed)?parsed:[];await nativeInvoke("migrate_copy_library",{items});localStorage.removeItem("lib")}catch(e){setActionStatus("cloudStatus","旧版数据迁移失败："+String(e),"error")}}
function bindStaticEvents(){
  populateToneSelects();
  document.querySelectorAll(".tab").forEach(tab=>{tab.addEventListener("click",()=>showTab(Number(tab.dataset.tabIndex)));tab.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();tab.click()}})});
  document.getElementById("tpl").addEventListener("change",()=>{scheduleRender();refreshPromptFromConfig("g","promptView")});
  document.getElementById("preset").addEventListener("change",loadPreset);
  ["num","tag","title","bodytxt","tags"].forEach(id=>document.getElementById(id).addEventListener("input",scheduleRender));updateSingleFitHint();updateBatchFitHint();
  document.getElementById("color1").addEventListener("change",event=>{cur={...cur,g1:event.target.value,a:event.target.value};updateGrad();scheduleRender()});
  document.getElementById("color2").addEventListener("change",event=>{cur={...cur,g2:event.target.value};updateGrad();scheduleRender()});
  ["fontFamily","titleWeight","bodyWeight","customTextColors","titleColor","bodyColor","tagColor"].forEach(id=>document.getElementById(id).addEventListener("change",()=>{syncTextColorInputs();scheduleRender()}));
  ["titleColor","bodyColor","tagColor"].forEach(id=>document.getElementById(id).addEventListener("input",scheduleRender));
  document.getElementById("preview0").addEventListener("click",event=>openLightbox(event.currentTarget.src));
  document.getElementById("clearHistoryButton").addEventListener("click",clearHist);
  document.getElementById("saveRenderButton").addEventListener("click",event=>saveRender(event.currentTarget));
  document.getElementById("generatePromptButton").addEventListener("click",event=>updPrompt(event.currentTarget));
  document.getElementById("singleGenerateCopyButton").addEventListener("click",event=>aiGen(event.currentTarget));
  document.getElementById("batchGeneratePromptButton").addEventListener("click",event=>bGenPrompt(event.currentTarget));
  document.getElementById("batchGenerateCopyButton").addEventListener("click",event=>bGen(event.currentTarget));
  ["gTheme","gLevel","gPersona","gTone","useEmoji"].forEach(id=>document.getElementById(id).addEventListener("change",()=>refreshPromptFromConfig("g","promptView")));
  document.getElementById("gRegion").addEventListener("input",()=>refreshPromptFromConfig("g","promptView"));
  ["bTheme","bLevel","bPersona","bTone","bUseEmoji"].forEach(id=>document.getElementById(id).addEventListener("change",()=>refreshPromptFromConfig("b","bPrompt")));
  document.getElementById("bRegion").addEventListener("input",()=>refreshPromptFromConfig("b","bPrompt"));
  document.getElementById("bTplMode").addEventListener("change",setBatchTemplateMode);document.getElementById("bTpl").addEventListener("change",()=>{refreshBatchItemFits();refreshPromptFromConfig("b","bPrompt")});
  document.getElementById("bCount").addEventListener("input",()=>{updateTemplateMixSummary();refreshPromptFromConfig("b","bPrompt")});
  ["bFontFamily","bTitleWeight","bBodyWeight","bCustomTextColors","bTitleColor","bBodyColor","bTagColor"].forEach(id=>document.getElementById(id).addEventListener("change",()=>syncTextColorInputs("b")));
  document.getElementById("batchRenderButton").addEventListener("click",bRender);
  document.getElementById("saveCloudServerButton").addEventListener("click",()=>saveCloudServer());
  document.getElementById("testCloudButton").addEventListener("click",testCloud);
  document.getElementById("cloudLoginButton").addEventListener("click",()=>cloudAuth("login"));
  document.getElementById("cloudRegisterButton").addEventListener("click",()=>cloudAuth("register"));
  document.getElementById("cloudLogoutButton").addEventListener("click",cloudLogout);
  document.getElementById("cloudUploadButton").addEventListener("click",cloudUpload);
  document.getElementById("cloudDownloadButton").addEventListener("click",cloudDownload);
  document.getElementById("saveDirectoryButton").addEventListener("click",saveDir);
  document.getElementById("openFolderButton").addEventListener("click",openFolder);
  document.getElementById("addAccountButton").addEventListener("click",addAccount);
  document.getElementById("saveAccountsButton").addEventListener("click",saveAccounts);
  const lightbox=document.getElementById("lightbox"),close=document.getElementById("lightboxClose");
  lightbox.addEventListener("click",event=>{if(event.target===lightbox||event.target===close)closeLightbox()});
  close.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();closeLightbox()}});
  document.addEventListener("keydown",event=>{if(event.key==="Escape")closeLightbox()});
  syncTextColorInputs();syncTextColorInputs("b");
}
bindStaticEvents();
if(nativeReady){migrateLegacy().then(()=>Promise.all([loadSettings(),loadCloudStatus(),loadAccounts(),loadHistory(),renderLib()]))}else{setActionStatus("cloudStatus","桌面服务不可用","error");loadHistory()}
</script></body></html>
